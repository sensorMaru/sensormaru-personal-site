    function navigateToDemoEvent(module, eventId) {
      if (hotspotDraw || !eventId) return;
      activeEventId = eventId;
      selectedEdgeKey = null;
      hoveredHotspotKey = null;
      hoveredStageHotspotKey = null;
      renderDemo(module);
    }

    function bindDemoStageNavigation(module, sourceId) {
      const stage = flow.querySelector('.demo-hotspot-stage');
      if (!stage || hotspotDraw) return;
      stage.addEventListener('mousemove', event => updateDemoStageHotspotHover(module, sourceId, event));
      stage.addEventListener('mouseleave', clearDemoStageHotspotHover);
      stage.addEventListener('click', event => {
        const targetId = findDemoHotspotTarget(module, sourceId, stagePointFromEvent(event));
        if (!targetId) return;
        event.preventDefault();
        navigateToDemoEvent(module, targetId);
      });
    }

    function bindHotspotDrawing(module) {
      if (!hotspotDraw) return;
      const toolbar = flow.querySelector('.demo-draw-toolbar');
      toolbar?.querySelectorAll('[data-hotspot-shape]').forEach(button => {
        button.addEventListener('click', () => {
          hotspotDraw.shape = button.dataset.hotspotShape === 'circle' ? 'circle' : 'rect';
          toolbar.querySelectorAll('[data-hotspot-shape]').forEach(item => item.classList.toggle('active', item === button));
        });
      });
      toolbar?.querySelector('[data-hotspot-action="finish"]')?.addEventListener('click', () => finishHotspotDrawing(module));
      toolbar?.querySelector('[data-hotspot-action="cancel"]')?.addEventListener('click', () => cancelHotspotDrawing(module));

      const stage = flow.querySelector('.demo-hotspot-stage');
      if (!stage) return;
      stage.addEventListener('pointerdown', event => {
        if (!hotspotDraw || event.button !== 0) return;
        hotspotDraw.start = stagePointFromEvent(event);
        hotspotDraw.preview = null;
        stage.setPointerCapture?.(event.pointerId);
        event.preventDefault();
      });
      stage.addEventListener('pointermove', event => {
        if (!hotspotDraw?.start) return;
        hotspotDraw.preview = normalizeHotspotShape(hotspotDraw.shape, hotspotDraw.start, stagePointFromEvent(event));
        renderDemoHotspotLayers();
        event.preventDefault();
      });
      stage.addEventListener('pointerup', event => {
        if (!hotspotDraw?.start) return;
        const shape = normalizeHotspotShape(hotspotDraw.shape, hotspotDraw.start, stagePointFromEvent(event));
        if (shape && shape.width >= 0.01 && shape.height >= 0.01) hotspotDraw.shapes.push(shape);
        hotspotDraw.start = null;
        hotspotDraw.preview = null;
        renderDemoHotspotLayers();
        event.preventDefault();
      });
      stage.addEventListener('pointercancel', () => {
        if (!hotspotDraw) return;
        hotspotDraw.start = null;
        hotspotDraw.preview = null;
        renderDemoHotspotLayers();
      });
    }

    function bindDemoNavigation(module) {
      flow.querySelectorAll('.demo-neighbor-card').forEach(card => {
        const navigate = () => {
          navigateToDemoEvent(module, card.dataset.eventId);
        };
        card.addEventListener('click', event => {
          if (event.target.closest('[data-hotspot-action]')) return;
          navigate();
        });
        card.addEventListener('keydown', event => {
          if (event.target.closest('[data-hotspot-action]')) return;
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            navigate();
          }
        });
        if (card.classList.contains('downstream')) {
          const show = () => showDemoHotspots(activeEventId, card.dataset.eventId);
          card.addEventListener('mouseenter', show);
          card.addEventListener('focusin', show);
          card.addEventListener('mouseleave', clearDemoHotspots);
          card.addEventListener('focusout', event => {
            if (!card.contains(event.relatedTarget)) clearDemoHotspots();
          });
        }
      });
      flow.querySelectorAll('.demo-hotspot-action').forEach(button => {
        button.addEventListener('click', event => {
          event.stopPropagation();
          const sourceId = button.dataset.sourceEventId;
          const targetId = button.dataset.eventId;
          if (button.dataset.hotspotAction === 'add') beginHotspotDrawing(module, sourceId, targetId);
          if (button.dataset.hotspotAction === 'delete') deleteDemoHotspots(sourceId, targetId);
        });
      });
    }

    function renderDemo(module) {
      const current = ensureDemoActiveEvent(module);
      selectedEdgeKey = null;
      activeFlowPositions = new Map();
      currentFlowState = null;
      flow.style.transform = 'none';
      flow.style.width = '100%';
      flow.style.height = 'auto';
      if (!current) {
        flow.innerHTML = '<div class="demo-empty">当前模块没有可演示的核心流程节点</div>';
        updateEdgeEditor(module);
        return;
      }
      const { upstreamNodes, downstreamNodes } = getDemoNeighbors(module, activeEventId);
      const image = current.uiImages?.[0];
      const imageContent = image
        ? `<img class="demo-ui-image" src="${escapeAttr(displayImageSrc(image.src))}" alt="${escapeAttr(current.name)} UI界面">`
        : '<div class="demo-empty">该埋点未匹配到 UI 图片</div>';
      const drawingForCurrent = hotspotDraw && hotspotDraw.sourceId === current.id;
      const toolbarHtml = drawingForCurrent ? renderHotspotDrawToolbar() : '';
      const paramBadges = current.params?.length
        ? current.params.slice(0, 12).map(param => `<span class="badge">${escapeHtml(param.name)}</span>`).join('')
        : '<span class="badge warn">无参数</span>';
      flow.innerHTML = `<div class="demo-view${drawingForCurrent ? ' hotspot-drawing' : ''}">
        ${drawingForCurrent ? '<div class="hotspot-drawing-overlay" aria-hidden="true"></div>' : ''}
        ${renderDemoNeighborList('上游节点', upstreamNodes, 'upstream', current.id)}
        <section class="demo-main">
          <div class="demo-current-head">
            <h3>路径聚焦</h3>
            <div class="demo-current-title">${escapeHtml(current.name)}</div>
            <div class="event-trigger">${escapeHtml(current.trigger || '未标注触发时机')}</div>
            <div class="demo-current-meta"><span class="badge">${escapeHtml(current.stage || '其它')}</span><span class="badge platform">${escapeHtml(current.platform || '未标注')}</span><span class="badge">${current.params?.length || 0} 参数</span></div>
          </div>
          ${toolbarHtml}
          <div class="demo-device">
            <div class="demo-hotspot-stage${drawingForCurrent ? ' drawing' : ''}">
              ${imageContent}
              <div class="demo-hotspot-layer demo-hotspot-saved" aria-hidden="true"></div>
              <div class="demo-hotspot-layer demo-hotspot-draft" aria-hidden="true"></div>
            </div>
          </div>
          <div class="demo-current-foot">
            <div class="mini">核心判断</div>
            <div>${escapeHtml(current.coreReason || '用户路径中的当前节点')}</div>
            <div class="badges">${paramBadges}</div>
          </div>
        </section>
        ${renderDemoNeighborList('下游操作', downstreamNodes, 'downstream', current.id)}
      </div>`;
      bindDemoNavigation(module);
      bindDemoStageNavigation(module, current.id);
      bindHotspotDrawing(module);
      renderDemoHotspotLayers();
      updateEdgeEditor(module);
    }

    function renderStage(stage, events) {
      return `<section class="stage">
        <div class="stage-head"><strong>${escapeHtml(stage)}</strong><span>${events.length} 个节点</span></div>
        <div class="nodes">
          ${events.length ? events.map(renderNode).join('') : '<div class="empty">无匹配埋点</div>'}
        </div>
      </section>`;
    }

    function renderNode(event) {
      const paramBadge = event.params.length ? `<span class="badge">${event.params.length} 参数</span>` : '<span class="badge warn">无参数</span>';
      const imageBadge = event.uiImages.length ? `<span class="badge">${event.uiImages.length} 图</span>` : '';
      const platform = event.platform || '未标注';
      return `<article class="node${event.id === activeEventId ? ' active' : ''}" data-event-id="${escapeAttr(event.id)}">
        <div class="event-name">${escapeHtml(event.name)}</div>
        <div class="event-trigger">${escapeHtml(event.trigger || '未标注触发时机')}</div>
        <div class="badges"><span class="badge platform">${escapeHtml(platform)}</span>${paramBadge}${imageBadge}</div>
      </article>`;
    }

    function renderDetail(module) {
      if (!$('detailName') || (CORE_FLOWCHART && activeView === 'flowchart')) return;
      const events = filteredEvents(module);
      const event = events.find(e => e.id === activeEventId) || events[0] || module.events[0];
      if (!event) return;
      const coreEvent = module.coreFlow?.events.find(item => item.id === event.id);
      const coreReasonHtml = CORE_FLOWCHART && coreEvent?.coreReason
        ? `<div class="kv"><span>核心判断</span><div>${escapeHtml(coreEvent.coreReason)}</div></div>`
        : '';
      activeEventId = event.id;
      $('detailName').textContent = event.name;
      $('detailMeta').innerHTML = `
        <div>模块：${escapeHtml(event.module || module.title)}</div>
        <div>阶段：${escapeHtml(event.stage)}</div>
        <div>平台：${escapeHtml(event.platform || '未标注')}</div>
        <div>来源行：${escapeHtml(event.sheet)} · Row ${event.row}</div>`;
      $('detailLogic').innerHTML = `
        <div class="kv"><span>触发</span><div>${escapeHtml(event.trigger || '未标注')}</div></div>
        <div class="kv"><span>UI备注</span><div>${escapeHtml(event.uiNote || '无')}</div></div>
        ${coreReasonHtml}`;
      $('detailImages').innerHTML = event.uiImages.length && CORE_FLOWCHART ? `
        <div class="ui-shot-wrap">
          <img class="ui-shot" src="${escapeAttr(displayImageSrc(event.uiImages[0].src))}" alt="${escapeAttr(event.name)} UI大图">
          ${event.uiImages.length > 1 ? `<div class="ui-gallery">${event.uiImages.slice(1).map((image, index) => `<a href="${escapeAttr(displayImageSrc(image.src))}" target="_blank" title="打开第 ${index + 2} 张 UI 图"><img class="ui-thumb" src="${escapeAttr(displayImageSrc(image.src))}" alt="${escapeAttr(event.name)} UI截图 ${index + 2}"></a>`).join('')}</div>` : ''}
        </div>` : event.uiImages.length ? `
        <div class="ui-gallery">
          ${event.uiImages.map((image, index) => `<a href="${escapeAttr(displayImageSrc(image.src))}" target="_blank" title="打开第 ${index + 1} 张 UI 图"><img class="ui-thumb" src="${escapeAttr(displayImageSrc(image.src))}" alt="${escapeAttr(event.name)} UI截图 ${index + 1}"></a>`).join('')}
        </div>` : '<div class="empty">该埋点未匹配到 UI 图片</div>';
      $('detailParams').innerHTML = event.params.length ? `
        <table><thead><tr><th>参数</th><th>含义 / 备注</th></tr></thead><tbody>
          ${event.params.map(p => `<tr><td>${escapeHtml(p.name)}</td><td>${escapeHtml([p.meaning, p.note].filter(Boolean).join('\n')) || '未标注'}</td></tr>`).join('')}
        </tbody></table>` : '<div class="empty">该埋点未标注参数</div>';
      $('mockTitle').textContent = event.stage;
      $('mockSub').textContent = event.module || module.title;
      $('mockEvent').textContent = event.name;
      $('mockTrigger').textContent = event.trigger || '未标注触发时机';
      $('mockGlyph').textContent = glyphForStage(event.stage);
      $('mockParams').innerHTML = (event.params.slice(0, 8).map(p => `<span class="badge">${escapeHtml(p.name)}</span>`).join('')) || '<span class="badge warn">无参数</span>';
      $('mockImage').innerHTML = event.uiImages.length ? `
        <div class="ui-shot-wrap">
          <img class="ui-shot" src="${escapeAttr(displayImageSrc(event.uiImages[0].src))}" alt="${escapeAttr(event.name)} UI截图">
          <div class="mini">来自 Excel UI备注区域${event.uiImages.length > 1 ? ` · 共 ${event.uiImages.length} 张` : ''}</div>
        </div>` : '<div class="ui-placeholder">该埋点未匹配到 UI 图片</div>';
    }

    function eventById(module, eventId) {
      return module.coreFlow?.nodes?.find(event => event.id === eventId)
        || module.coreFlow?.events.find(event => event.id === eventId)
        || module.events.find(event => event.id === eventId);
    }

    function openEventPicker() {
      if (!eventPicker || !eventSearch || !eventResults) return;
      eventPicker.hidden = false;
      eventSearch.value = '';
      if (globalEventSearch) globalEventSearch.checked = false;
      renderEventResults('');
      requestAnimationFrame(() => eventSearch.focus());
    }

    function closeEventPicker() {
      if (!eventPicker) return;
      eventPicker.hidden = true;
      pendingCreatePosition = null;
    }

    function setPreviewingResult(button) {
      eventResults?.querySelectorAll('.event-result').forEach(result => result.classList.toggle('previewing', result === button));
    }

    function renderEventPickerPreview(event, sourceModule) {
      if (!eventPickerPreview) return;
      if (!event) {
        eventPickerPreview.innerHTML = '<div class="event-preview-empty">鼠标悬停在左侧埋点上，查看对应 UI备注图片</div>';
        return;
      }
      const images = event.uiImages || [];
      eventPickerPreview.innerHTML = `
        <div class="event-preview-head">
          <div class="event-preview-title">${escapeHtml(event.name)}</div>
          <div class="event-preview-sub">${escapeHtml(event.trigger || '未标注触发时机')} · ${escapeHtml(sourceModule?.title || event.module || '当前模块')}</div>
        </div>
        ${images.length ? `
          <img class="event-preview-main" src="${escapeAttr(displayImageSrc(images[0].src))}" alt="${escapeAttr(event.name)} UI备注图片">
          ${images.length > 1 ? `<div class="event-preview-gallery">${images.slice(1).map((image, index) => `<img class="event-preview-thumb" src="${escapeAttr(displayImageSrc(image.src))}" alt="${escapeAttr(event.name)} UI备注图片 ${index + 2}">`).join('')}</div>` : ''}
        ` : '<div class="event-preview-empty">该埋点未匹配到 UI备注图片</div>'}
      `;
    }

    function renderEventResults(query) {
      if (!eventResults) return;
      const module = DATA.modules[activeModuleIndex];
      const visibleNodes = getEditableNodes(module);
      const visibleNodeIds = new Set(visibleNodes.map(node => node.id));
      const keyword = query.trim().toLowerCase();
      const searchModules = globalEventSearch?.checked
        ? DATA.modules.map((sourceModule, sourceModuleIndex) => ({ sourceModule, sourceModuleIndex }))
        : [{ sourceModule: module, sourceModuleIndex: activeModuleIndex }];
      const matches = searchModules.flatMap(({ sourceModule, sourceModuleIndex }) =>
        sourceModule.events.map(event => ({ event, sourceModule, sourceModuleIndex }))
      )
        .filter(({ event, sourceModule }) => {
          const haystack = [event.name, event.trigger, event.module, event.platform].join(' ').toLowerCase();
          return !keyword || haystack.includes(keyword);
        })
        .slice(0, 30);
      eventResults.innerHTML = matches.length ? matches.map(({ event, sourceModule, sourceModuleIndex }) => {
        const exists = visibleNodeIds.has(event.id);
        const moduleLabel = sourceModuleIndex === activeModuleIndex ? '' : ` · ${sourceModule.title}`;
        return `<button class="event-result" type="button" data-event-id="${escapeAttr(event.id)}" data-source-module-index="${sourceModuleIndex}" aria-disabled="${exists ? 'true' : 'false'}">
          <div class="event-name">${escapeHtml(event.name)}</div>
          <div class="mini">${escapeHtml(event.trigger || '未标注触发时机')}${escapeHtml(moduleLabel)}${exists ? ' · 已在图中' : ''}</div>
        </button>`;
      }).join('') : '<div class="empty">没有匹配的埋点</div>';
      if (matches.length) {
        renderEventPickerPreview(matches[0].event, matches[0].sourceModule);
        eventResults.querySelector('.event-result')?.classList.add('previewing');
      } else {
        renderEventPickerPreview(null, null);
      }
      eventResults.querySelectorAll('.event-result').forEach(button => {
        const preview = () => {
          const sourceModuleIndex = Number(button.dataset.sourceModuleIndex);
          const sourceModule = DATA.modules[sourceModuleIndex] || module;
          const event = sourceModule.events.find(item => item.id === button.dataset.eventId);
          setPreviewingResult(button);
          renderEventPickerPreview(event, sourceModule);
        };
        button.addEventListener('mouseenter', preview);
        button.addEventListener('focus', preview);
        button.addEventListener('click', () => {
          if (button.getAttribute('aria-disabled') === 'true') return;
          createEventNode(module, button.dataset.eventId, Number(button.dataset.sourceModuleIndex));
        });
      });
    }

    function createEventNode(module, eventId, sourceModuleIndex = activeModuleIndex) {
      const sourceModule = DATA.modules[sourceModuleIndex] || module;
      const event = sourceModule.events.find(item => item.id === eventId);
      if (!event || !pendingCreatePosition) return;
      const beforeDraft = snapshotModuleDraft(module);
      const draft = getModuleDraft(module);
      const node = {
        ...event,
        flowColumn: 1,
        flowRow: 0,
        coreReason: '用户手动添加',
        isGroup: false,
      };
      draft.removedNodeIds = (draft.removedNodeIds || []).filter(id => id !== node.id);
      draft.addedNodes = [...(draft.addedNodes || []).filter(item => item.id !== node.id), node];
      draft.positions = { ...(draft.positions || {}), [node.id]: { x: Math.round(pendingCreatePosition.x), y: Math.round(pendingCreatePosition.y) } };
      setModuleDraft(module, draft);
      activeEventId = node.id;
      selectedEdgeKey = null;
      closeEventPicker();
      renderFlow(module);
      recordFlowEdit(module, beforeDraft, '已添加卡片，记得保存');
    }

    function renderParamTooltip(event) {
      const paramRows = event.params.map(param => ({ eventName: event.name, ...param }));
      const paramsHtml = paramRows.length ? `
        <table><thead><tr><th>埋点</th><th>参数</th><th>含义</th><th>备注</th></tr></thead><tbody>
          ${paramRows.map(param => `<tr><td>${escapeHtml(param.eventName)}</td><td>${escapeHtml(param.name)}</td><td>${escapeHtml(param.meaning || '未标注')}</td><td>${escapeHtml(param.note || '未标注')}</td></tr>`).join('')}
        </tbody></table>` : '<div class="empty">该埋点未标注参数</div>';
      return `<h4>${escapeHtml(event.name)}</h4>${paramsHtml}`;
    }

    function showParamTooltip(event, pointerEvent) {
      if (!paramTooltip) return;
      paramTooltip.innerHTML = renderParamTooltip(event);
      paramTooltip.hidden = false;
      moveParamTooltip(pointerEvent);
    }

    function moveParamTooltip(pointerEvent) {
      if (!paramTooltip || paramTooltip.hidden) return;
      const offset = 14;
      const rect = paramTooltip.getBoundingClientRect();
      const left = Math.min(pointerEvent.clientX + offset, window.innerWidth - rect.width - 12);
      const top = Math.min(pointerEvent.clientY + offset, window.innerHeight - rect.height - 12);
      paramTooltip.style.left = `${Math.max(12, left)}px`;
      paramTooltip.style.top = `${Math.max(12, top)}px`;
    }

    function hideParamTooltip() {
      if (!paramTooltip) return;
      paramTooltip.hidden = true;
    }

    function glyphForStage(stage) {
      return {
        '入口': '↗',
        '页面曝光': '◉',
        '点击操作': '↵',
        '弹窗/确认': '□',
        '处理中': '…',
        '结果/成功': '✓',
        '异常/失败': '!',
        '其它': '?'
      }[stage] || '?';
    }

    function renderSummary(module) {
      $('moduleTitle').textContent = module.title;
      const coreNodeCount = module.coreFlow.nodes?.length || module.coreFlow.events.length;
      $('moduleSub').textContent = CORE_FLOWCHART
        ? `${module.sheet} · 核心流程 ${coreNodeCount} 个节点 · 隐藏 ${module.coreFlow.omittedCount} 个非核心埋点`
        : module.sheet;
      $('statEvents').textContent = module.summary.eventCount;
      $('statParams').textContent = module.summary.paramCount;
      $('statImages').textContent = module.summary.imageCount;
      $('statPlatform').textContent = Object.keys(module.summary.platformCounts).length;
    }

    function render() {
      const module = DATA.modules[activeModuleIndex];
      updateViewClass();
      renderPlatformFilter(module);
      renderSummary(module);
      renderModuleList();
      renderFlow(module);
    }

    function updateViewClass() {
      if (!appRoot) return;
      appRoot.classList.toggle('is-flowchart', activeView === 'flowchart');
      appRoot.classList.toggle('is-demo', activeView === 'demo');
      appRoot.classList.toggle('is-stage', activeView === 'stage');
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function escapeAttr(value) { return escapeHtml(value).replace(/`/g, '&#96;'); }
    function shortText(value, maxLength) {
      const text = String(value ?? '');
      return text.length > maxLength ? text.slice(0, Math.max(1, maxLength - 1)) + '…' : text;
    }

    document.querySelectorAll('.chip').forEach(chip => chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      activeStage = chip.dataset.stage;
      activeEventId = null;
      render();
    }));
    document.querySelectorAll('.view-btn').forEach(button => button.addEventListener('click', () => {
      document.querySelectorAll('.view-btn').forEach(item => item.classList.remove('active'));
      button.classList.add('active');
      const nextView = button.dataset.view;
      if (nextView === 'stage') activeEventId = null;
      activeView = nextView;
      clearEdgeSelection();
      render();
    }));
    platformFilter?.addEventListener('change', () => {
      activePlatform = platformFilter.value;
      activeEventId = null;
      render();
    });
    search.addEventListener('input', () => {
      activeEventId = null;
      clearEdgeSelection();
      render();
    });
    $('zoomIn').addEventListener('click', () => zoomCanvasBy(1.12));
    $('zoomOut').addEventListener('click', () => zoomCanvasBy(1 / 1.12));
    undoEditButton?.addEventListener('click', undoFlowEdit);
    redoEditButton?.addEventListener('click', redoFlowEdit);
    saveEdgesButton?.addEventListener('click', saveEditableLinks);
    checkUpdateButton?.addEventListener('click', checkForUpdates);
    exportImageButton?.addEventListener('click', downloadFlowchartImage);
    resetEdgesButton?.addEventListener('click', () => resetEditableLinks(DATA.modules[activeModuleIndex]));
    eventSearch?.addEventListener('input', () => renderEventResults(eventSearch.value));
    globalEventSearch?.addEventListener('change', () => renderEventResults(eventSearch?.value || ''));
    eventPickerClose?.addEventListener('click', closeEventPicker);
    eventPicker?.addEventListener('click', event => {
      if (event.target === eventPicker) closeEventPicker();
    });
    document.addEventListener('pointermove', event => {
      moveActiveNode(event);
      moveActiveNodeResize(event);
      moveEdgeDraft(event);
      moveCanvasPan(event);
    });
    document.addEventListener('pointerup', () => {
      finishActiveNodeDrag();
      finishActiveNodeResize();
      finishEdgeDraft();
      finishCanvasPan();
    });
    document.addEventListener('keydown', event => {
      const tagName = document.activeElement?.tagName;
      if (tagName === 'INPUT' || tagName === 'TEXTAREA') return;
      if (event.key === 'Backspace') {
        event.preventDefault();
        deleteActiveSelection();
      }
      if (event.key === 'Escape') {
        closeEventPicker();
        clearFlowSelection();
      }
    });
    bindCoreCanvasNavigation();
    render();
  </script>
</body>
</html>
