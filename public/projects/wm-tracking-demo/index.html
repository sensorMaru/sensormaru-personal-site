    function loadSavedFlowDrafts() {
      if (!CORE_FLOWCHART) return {};
      try {
        const saved = localStorage.getItem(EDGE_STORAGE_KEY);
        return saved ? JSON.parse(saved) || {} : clonePlain(EMBEDDED_FLOW_DRAFTS);
      } catch (error) {
        return clonePlain(EMBEDDED_FLOW_DRAFTS);
      }
    }

    function clonePlain(value) {
      return JSON.parse(JSON.stringify(value || {}));
    }

    function loadSavedDemoHotspots() {
      try {
        const saved = localStorage.getItem(HOTSPOT_STORAGE_KEY);
        return saved ? JSON.parse(saved) || {} : {};
      } catch (error) {
        return {};
      }
    }

    function saveDemoHotspots() {
      try {
        localStorage.setItem(HOTSPOT_STORAGE_KEY, JSON.stringify(demoHotspots || {}));
      } catch (error) {
        // 本地存储不可用时仍保留当前页面内的热区状态。
      }
    }

    function eventMatchesFilters(module, event) {
      const query = search.value.trim().toLowerCase();
      const haystack = [
        module.title, event.module, event.name, event.trigger, event.uiNote,
        event.platform, event.stage, event.coreReason || '', ...event.params.flatMap(p => [p.name, p.meaning, p.note])
      ].join(' ').toLowerCase();
      return (activeStage === '全部' || event.stage === activeStage)
        && (activePlatform === '全部' || event.platform === activePlatform)
        && (!query || haystack.includes(query));
    }

    function filteredEvents(module) {
      return module.events.filter(event => eventMatchesFilters(module, event));
    }

    function moduleStorageKey(module) {
      return module.sheet || module.title;
    }

    function edgeKey(link) {
      return `${link.source}::${link.target}`;
    }

    function demoHotspotKey(sourceId, targetId) {
      return `${sourceId}::${targetId}`;
    }

    function defaultModuleDraft(module) {
      return {
        links: cloneLinks(module.coreFlow.links),
        positions: {},
        removedNodeIds: [],
        addedNodes: [],
      };
    }

    function getModuleDraft(module) {
      const key = moduleStorageKey(module);
      const saved = flowDrafts[key];
      if (Array.isArray(saved)) {
        return { ...defaultModuleDraft(module), links: cloneLinks(saved) };
      }
      if (saved && typeof saved === 'object') {
        return {
          ...defaultModuleDraft(module),
          ...saved,
          links: cloneLinks(saved.links || module.coreFlow.links),
          positions: { ...(saved.positions || {}) },
          removedNodeIds: [...(saved.removedNodeIds || [])],
          addedNodes: cloneNodes(saved.addedNodes || []),
        };
      }
      return defaultModuleDraft(module);
    }

    function setModuleDraft(module, draft) {
      flowDrafts[moduleStorageKey(module)] = {
        links: cloneLinks(draft.links),
        positions: { ...(draft.positions || {}) },
        removedNodeIds: [...(draft.removedNodeIds || [])],
        addedNodes: cloneNodes(draft.addedNodes || []),
      };
    }

    function cloneDraft(draft) {
      return {
        links: cloneLinks(draft.links),
        positions: { ...(draft.positions || {}) },
        removedNodeIds: [...(draft.removedNodeIds || [])],
        addedNodes: cloneNodes(draft.addedNodes || []),
      };
    }

    function snapshotModuleDraft(module) {
      return cloneDraft(getModuleDraft(module));
    }

    function draftsEqual(left, right) {
      return JSON.stringify(left) === JSON.stringify(right);
    }

    function recordFlowEdit(module, beforeDraft, statusText) {
      if (!CORE_FLOWCHART || !beforeDraft) return;
      const afterDraft = snapshotModuleDraft(module);
      if (draftsEqual(beforeDraft, afterDraft)) return;
      undoStack.push({ moduleKey: moduleStorageKey(module), before: cloneDraft(beforeDraft), after: cloneDraft(afterDraft) });
      if (undoStack.length > 100) undoStack.shift();
      redoStack.length = 0;
      updateUndoRedoButtons();
      if (statusText) setEdgeStatus(statusText);
    }

    function restoreFlowDraft(moduleKey, draft, statusText) {
      const module = DATA.modules.find(item => moduleStorageKey(item) === moduleKey);
      if (!module) return;
      flowDrafts[moduleKey] = cloneDraft(draft);
      selectedEdgeKey = null;
      activeEventId = null;
      edgeDraft = null;
      if (moduleStorageKey(DATA.modules[activeModuleIndex]) === moduleKey) {
        renderFlow(module);
      } else {
        renderModuleList();
      }
      updateUndoRedoButtons();
      if (statusText) setEdgeStatus(statusText);
    }

    function undoFlowEdit() {
      if (!CORE_FLOWCHART || !undoStack.length) return;
      const entry = undoStack.pop();
      redoStack.push(entry);
      restoreFlowDraft(entry.moduleKey, entry.before, '已撤销，记得保存');
    }

    function redoFlowEdit() {
      if (!CORE_FLOWCHART || !redoStack.length) return;
      const entry = redoStack.pop();
      undoStack.push(entry);
      restoreFlowDraft(entry.moduleKey, entry.after, '已重做，记得保存');
    }

    function updateUndoRedoButtons() {
      if (undoEditButton) undoEditButton.disabled = !undoStack.length;
      if (redoEditButton) redoEditButton.disabled = !redoStack.length;
    }

    function cloneLinks(links) {
      return (links || []).map(link => ({ ...link }));
    }

    function cloneNodes(nodes) {
      return (nodes || []).map(node => {
        const { events, sourceEventIds, ...rest } = node || {};
        return {
          ...rest,
          isGroup: false,
          params: (node.params || []).map(param => ({ ...param })),
          uiImages: (node.uiImages || []).map(image => ({ ...image })),
        };
      });
    }

    function getEditableLinks(module) {
      if (!CORE_FLOWCHART) return cloneLinks(module.flowLinks);
      return getModuleDraft(module).links;
    }

    function setEditableLinks(module, links) {
      if (!CORE_FLOWCHART) return;
      const draft = getModuleDraft(module);
      draft.links = cloneLinks(links);
      setModuleDraft(module, draft);
    }

    function getEditableNodes(module) {
      if (!CORE_FLOWCHART) return module.events;
      const draft = getModuleDraft(module);
      const removed = new Set(draft.removedNodeIds || []);
      const baseNodes = cloneNodes(module.coreFlow.nodes || module.coreFlow.events).filter(node => !removed.has(node.id));
      const baseIds = new Set(baseNodes.map(node => node.id));
      const addedNodes = cloneNodes(draft.addedNodes || []).filter(node => !removed.has(node.id) && !baseIds.has(node.id));
      return [...baseNodes, ...addedNodes];
    }

    function setEditableNodeRect(module, nodeId, position) {
      if (!CORE_FLOWCHART) return;
      const draft = getModuleDraft(module);
      const current = draft.positions[nodeId] || {};
      draft.positions[nodeId] = {
        ...current,
        x: Math.round(position.x),
        y: Math.round(position.y),
        width: Math.round(position.width || current.width || 0),
        height: Math.round(position.height || current.height || 0),
      };
      setModuleDraft(module, draft);
    }

    function setEditablePosition(module, nodeId, position) {
      setEditableNodeRect(module, nodeId, position);
    }

    function removeEditablePosition(module, nodeId) {
      if (!CORE_FLOWCHART) return;
      const draft = getModuleDraft(module);
      delete draft.positions[nodeId];
      setModuleDraft(module, draft);
    }

    function saveEditableLinks() {
      if (!CORE_FLOWCHART) return;
      localStorage.setItem(EDGE_STORAGE_KEY, JSON.stringify(flowDrafts));
      setEdgeStatus('已保存，刷新后保留');
    }

    function stringifyForScript(value) {
      const unsafe = {
        '<': '\\u003c',
        '>': '\\u003e',
        '&': '\\u0026',
        '\u2028': '\\u2028',
        '\u2029': '\\u2029',
      };
      return JSON.stringify(value).replace(/[<>&\u2028\u2029]/g, char => unsafe[char]);
    }

    function confirmHtmlExportImageDependency() {
      if (EMBED_IMAGES) {
        const message = [
          '导出的 HTML 会包含当前编辑快照。',
          '页面 UI截图已内嵌，分享时无需额外携带 ui-images 文件夹。',
          '是否继续保存？',
        ].join('\n');
        return typeof window.confirm !== 'function' || window.confirm(message);
      }
      const message = [
        '导出的 HTML 会包含当前编辑快照，并内嵌“导出图片”所需的压缩图片数据。',
        '页面内 UI备注图片仍依赖同目录下的 ui-images 文件夹。',
        '分享给别人时，请一起发送整个项目文件夹。是否继续保存？',
      ].join('\n');
      return typeof window.confirm !== 'function' || window.confirm(message);
    }

    function saveAsNewHtml() {
      if (!CORE_FLOWCHART) return;
      if (!confirmHtmlExportImageDependency()) return;
      const snapshotId = new Date().toISOString().replace(/[-:.TZ]/g, '').slice(0, 14);
      const source = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      const withDrafts = source
        .replace(/const EMBEDDED_FLOW_DRAFTS = .*;\n/, `const EMBEDDED_FLOW_DRAFTS = ${stringifyForScript(flowDrafts)};\n`)
        .replace(/const EMBEDDED_FLOW_SNAPSHOT_ID = .*;\n/, `const EMBEDDED_FLOW_SNAPSHOT_ID = "snapshot-${snapshotId}";\n`);
      const blob = new Blob([withDrafts], { type: 'text/html;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `tracking_demo_${snapshotId}.html`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(link.href);
      setEdgeStatus(EMBED_IMAGES ? '已导出自包含新HTML' : '已导出新HTML，图片仍需和 ui-images 文件夹放在一起');
    }

    function exportFileTimestamp() {
      return new Date().toISOString().replace(/[-:.TZ]/g, '').slice(0, 14);
    }

    function inlineFlowchartImageSources(sourceChart, clonedChart) {
      const sourceImages = Array.from(sourceChart.querySelectorAll('img'));
      const clonedImages = Array.from(clonedChart.querySelectorAll('img'));
      clonedImages.forEach((image, index) => {
        const sourceImage = sourceImages[index];
        const relativeSrc = sourceImage?.getAttribute('src') || '';
        const safeSource = EXPORT_IMAGE_DATA[relativeSrc] || EXPORT_IMAGE_DATA[sourceImage?.currentSrc] || EXPORT_IMAGE_DATA[sourceImage?.src];
        if (safeSource || sourceImage?.currentSrc || sourceImage?.src) {
          image.setAttribute('src', safeSource || sourceImage.currentSrc || sourceImage.src);
        }
      });
    }

    function prepareFlowchartCloneForExport(sourceChart) {
      const clone = sourceChart.cloneNode(true);
      const width = Math.ceil(currentFlowState?.width || sourceChart.offsetWidth || sourceChart.scrollWidth);
      const height = Math.ceil(currentFlowState?.height || sourceChart.offsetHeight || sourceChart.scrollHeight);
      clone.style.width = `${width}px`;
      clone.style.height = `${height}px`;
      clone.style.transform = 'none';
      clone.style.transformOrigin = 'top left';
      clone.querySelectorAll('.edge-handle, .resize-handle, .flow-edge-hit, #edgeDraftLine').forEach(element => element.remove());
      clone.querySelectorAll('.flowchart-node').forEach(node => {
        node.classList.remove('active', 'dragging', 'resizing', 'edge-source');
      });
      clone.querySelectorAll('.flow-edge-group').forEach(group => group.classList.remove('selected'));
      inlineFlowchartImageSources(sourceChart, clone);
      return { clone, width, height };
    }

    function serializeFlowchartForExport(clone, width, height, scale) {
      const styleText = Array.from(document.querySelectorAll('style')).map(style => style.textContent || '').join('\n');
      const serializedChart = new XMLSerializer().serializeToString(clone);
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${width * scale}" height="${height * scale}" viewBox="0 0 ${width} ${height}">
        <foreignObject width="${width}" height="${height}">
          <div xmlns="http://www.w3.org/1999/xhtml">
            <style>${styleText}</style>
            ${serializedChart}
          </div>
        </foreignObject>
      </svg>`;
    }

    function waitForFlowchartImages(chart) {
      const images = Array.from(chart.querySelectorAll('img'));
      return Promise.all(images.map(image => {
        if (image.complete && image.naturalWidth) return Promise.resolve();
        return new Promise(resolve => {
          image.addEventListener('load', resolve, { once: true });
          image.addEventListener('error', resolve, { once: true });
        });
      }));
    }

    function svgTextToImage(svgText) {
      return new Promise((resolve, reject) => {
        const blob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const image = new Image();
        image.onload = () => {
          URL.revokeObjectURL(url);
          resolve(image);
        };
        image.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('图片渲染失败'));
        };
        image.src = url;
      });
    }

    function downloadBlob(blob, filename) {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(link.href);
    }

    function canvasToBlob(canvas) {
      return new Promise((resolve, reject) => {
        try {
          canvas.toBlob(blob => {
            if (blob) resolve(blob);
            else reject(new Error('图片生成失败'));
          }, 'image/png', 1);
        } catch (error) {
          reject(error);
        }
      });
    }

    function loadExportImage(src) {
      const imageSrc = EXPORT_IMAGE_DATA[src] || src;
      if (!imageSrc) return Promise.resolve(null);
      return new Promise(resolve => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => resolve(null);
        image.src = imageSrc;
      });
    }

    async function loadExportImages(events) {
      const entries = await Promise.all(events.map(async event => {
        const src = event.uiImages?.[0]?.src || '';
        return [event.id, src ? await loadExportImage(src) : null];
      }));
      return new Map(entries);
    }

    function displayImageSrc(src) {
      return EMBED_IMAGES ? (EXPORT_IMAGE_DATA[src] || src) : src;
    }

    function drawExportWrappedText(context, text, x, y, maxWidth, lineHeight, maxLines) {
      const chars = Array.from(String(text || ''));
      const lines = [];
      let line = '';
      chars.forEach(char => {
        if (lines.length >= maxLines) return;
        const next = line + char;
        if (line && context.measureText(next).width > maxWidth) {
          lines.push(line);
          line = char;
        } else {
          line = next;
        }
      });
      if (line && lines.length < maxLines) lines.push(line);
      lines.forEach((currentLine, index) => {
        context.fillText(currentLine, x, y + index * lineHeight);
      });
      return y + lines.length * lineHeight;
    }

    function getExportEdgeGeometry(link, positions) {
      const source = positions.get(link.source);
      const target = positions.get(link.target);
      if (!source || !target) return null;
      const sameColumn = Math.abs((target.x + target.width / 2) - (source.x + source.width / 2)) < 1;
      const targetBelow = target.y + target.height / 2 >= source.y + source.height / 2;
      const targetRight = target.x + target.width / 2 >= source.x + source.width / 2;
      const fallbackSourceSide = sameColumn ? (targetBelow ? 'bottom' : 'top') : (targetRight ? 'right' : 'left');
      const fallbackTargetSide = sameColumn ? (targetBelow ? 'top' : 'bottom') : (targetRight ? 'left' : 'right');
      const sourceSide = link.sourceSide || fallbackSourceSide;
      const targetSide = link.targetSide || fallbackTargetSide;
      const start = edgeMidpoint(source, sourceSide);
      const end = edgeMidpoint(target, targetSide);
      const horizontal = sourceSide === 'left' || sourceSide === 'right';
      const mid = horizontal ? (start.x + end.x) / 2 : (start.y + end.y) / 2;
      const controlOne = horizontal ? { x: mid, y: start.y } : { x: start.x, y: mid };
      const controlTwo = horizontal ? { x: mid, y: end.y } : { x: end.x, y: mid };
      return { start, end, controlOne, controlTwo };
    }

    function drawExportFlowEdge(context, link, positions) {
      const geometry = getExportEdgeGeometry(link, positions);
      if (!geometry) return;
      const { start, end, controlOne, controlTwo } = geometry;
      context.save();
      context.strokeStyle = '#94a3b8';
      context.fillStyle = '#94a3b8';
      context.lineWidth = 1.8;
      context.lineCap = 'round';
      context.beginPath();
      context.moveTo(start.x, start.y);
      context.bezierCurveTo(controlOne.x, controlOne.y, controlTwo.x, controlTwo.y, end.x, end.y);
      context.stroke();
      context.beginPath();
      context.arc(start.x, start.y, 3.2, 0, Math.PI * 2);
      context.fill();
      const angle = Math.atan2(end.y - controlTwo.y, end.x - controlTwo.x);
      const arrowLength = 11;
      const arrowWidth = 6.5;
      context.beginPath();
      context.moveTo(end.x, end.y);
      context.lineTo(
        end.x - arrowLength * Math.cos(angle) + arrowWidth * Math.sin(angle),
        end.y - arrowLength * Math.sin(angle) - arrowWidth * Math.cos(angle)
      );
      context.lineTo(
        end.x - arrowLength * Math.cos(angle) - arrowWidth * Math.sin(angle),
        end.y - arrowLength * Math.sin(angle) + arrowWidth * Math.cos(angle)
      );
      context.closePath();
      context.fill();
      context.restore();
    }

    function drawExportFlowNode(context, event, position, image) {
      const nodeScale = nodeScaleFromPosition(position);
      const mediaSize = flowMediaSize(event.uiImages?.[0]);
      const mediaHeight = Math.round(mediaSize.height * nodeScale);
      const headHeight = Math.max(36, position.height - mediaHeight);
      const padding = Math.max(4, 8 * nodeScale);
      const textWidth = Math.max(20, position.width - padding * 2);
      context.save();
      context.shadowColor = 'rgba(15, 23, 42, .08)';
      context.shadowBlur = 18;
      context.shadowOffsetY = 8;
      context.fillStyle = '#ffffff';
      context.fillRect(position.x, position.y, position.width, position.height);
      context.restore();

      context.save();
      context.fillStyle = '#ffffff';
      context.fillRect(position.x, position.y, position.width, headHeight);
      context.fillStyle = '#101828';
      context.font = `${Math.max(8, 12 * nodeScale)}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
      context.textBaseline = 'top';
      const titleEndY = drawExportWrappedText(
        context,
        event.name,
        position.x + padding,
        position.y + padding,
        textWidth,
        Math.max(11, 15.6 * nodeScale),
        4
      );
      context.fillStyle = '#667085';
      context.font = `${Math.max(7, 11 * nodeScale)}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
      drawExportWrappedText(
        context,
        event.trigger || '未标注触发时机',
        position.x + padding,
        titleEndY + Math.max(2, 3 * nodeScale),
        textWidth,
        Math.max(10, 14.8 * nodeScale),
        2
      );
      context.restore();

      const mediaY = position.y + headHeight;
      const availableMediaHeight = Math.max(0, position.height - headHeight);
      context.save();
      context.beginPath();
      context.rect(position.x, mediaY, position.width, availableMediaHeight);
      context.clip();
      if (image?.naturalWidth && image?.naturalHeight && availableMediaHeight > 0) {
        const fit = Math.min(position.width / image.naturalWidth, availableMediaHeight / image.naturalHeight);
        const drawWidth = image.naturalWidth * fit;
        const drawHeight = image.naturalHeight * fit;
        const drawX = position.x + (position.width - drawWidth) / 2;
        const drawY = mediaY + (availableMediaHeight - drawHeight) / 2;
        context.drawImage(image, drawX, drawY, drawWidth, drawHeight);
      } else {
        context.fillStyle = '#f8fafc';
        context.fillRect(position.x, mediaY, position.width, availableMediaHeight);
        context.fillStyle = '#98a2b3';
        context.font = `${Math.max(8, 12 * nodeScale)}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.fillText('无 UI 图', position.x + position.width / 2, mediaY + availableMediaHeight / 2);
      }
      context.restore();
    }

    async function renderFlowchartToCanvas(scale = 2) {
      if (!currentFlowState) throw new Error('当前没有可导出的画布');
      const width = Math.ceil(currentFlowState.width);
      const height = Math.ceil(currentFlowState.height);
      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(width * scale);
      canvas.height = Math.ceil(height * scale);
      const context = canvas.getContext('2d');
      context.scale(scale, scale);
      context.fillStyle = '#ffffff';
      context.fillRect(0, 0, width, height);
      context.strokeStyle = 'rgba(216, 222, 233, .55)';
      context.lineWidth = 1;
      for (let x = 0; x <= width; x += 220) {
        context.beginPath();
        context.moveTo(x + 0.5, 0);
        context.lineTo(x + 0.5, height);
        context.stroke();
      }
      if (CORE_FLOWCHART) {
        context.fillStyle = '#475467';
        context.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
        context.textBaseline = 'top';
        drawExportWrappedText(
          context,
          '核心流程视图已隐藏历史、权限、订阅、推送等非核心页面；节点根据埋点名称、触发时机和 UI 图片位置推断为主要功能链路。',
          30,
          10,
          Math.max(120, width - 60),
          16,
          2
        );
      }
      const visibleIds = new Set(currentFlowState.positions.keys());
      const links = getEditableLinks(currentFlowState.module).filter(link => visibleIds.has(link.source) && visibleIds.has(link.target));
      links.forEach(link => drawExportFlowEdge(context, link, currentFlowState.positions));
      const events = getEditableNodes(currentFlowState.module).filter(event => currentFlowState.positions.has(event.id));
      const imageMap = await loadExportImages(events);
      events.forEach(event => drawExportFlowNode(context, event, currentFlowState.positions.get(event.id), imageMap.get(event.id)));
      return canvas;
    }

    async function downloadFlowchartImage() {
      if (!CORE_FLOWCHART || activeView !== 'flowchart') return;
      const chart = flow.querySelector('.flowchart');
      if (!chart || !currentFlowState) {
        setEdgeStatus('当前没有可导出的画布');
        return;
      }
      try {
        if (exportImageButton) exportImageButton.disabled = true;
        setEdgeStatus('正在导出图片...');
        await waitForFlowchartImages(chart);
        const scale = Math.min(3, Math.max(2, window.devicePixelRatio || 2));
        const canvas = await renderFlowchartToCanvas(scale);
        const blob = await canvasToBlob(canvas);
        downloadBlob(blob, `tracking_canvas_${exportFileTimestamp()}.png`);
        setEdgeStatus('已导出高清图片');
      } catch (error) {
        console.error(error);
        setEdgeStatus('导出失败，请重试');
      } finally {
        if (exportImageButton) exportImageButton.disabled = false;
      }
    }

    function resetEditableLinks(module) {
      if (!CORE_FLOWCHART) return;
      const beforeDraft = snapshotModuleDraft(module);
      delete flowDrafts[moduleStorageKey(module)];
      selectedEdgeKey = null;
      activeEventId = null;
      edgeDraft = null;
      renderFlow(module);
      recordFlowEdit(module, beforeDraft, '已恢复默认，记得保存');
    }

    function clearEdgeSelection() {
      selectedEdgeKey = null;
      edgeDraft = null;
    }

    function clearFlowSelection() {
      selectedEdgeKey = null;
      activeEventId = null;
      flow.querySelectorAll('.node, .flowchart-node').forEach(node => node.classList.remove('active'));
      updateEdgeSelection();
      setEdgeStatus('');
    }

    function renderModuleList() {
      const query = search.value.trim().toLowerCase();
      moduleList.innerHTML = '';
      DATA.modules.forEach((module, index) => {
        const count = filteredEvents(module).length;
        const matches = !query || [module.title, module.sheet, ...module.events.map(e => e.name)].join(' ').toLowerCase().includes(query) || count > 0;
        if (!matches) return;
        const button = document.createElement('button');
        button.className = 'module-btn' + (index === activeModuleIndex ? ' active' : '');
        const coreNodeCount = module.coreFlow.nodes?.length || module.coreFlow.events.length;
        const flowMeta = CORE_FLOWCHART ? ` · 核心流程 ${coreNodeCount} 节点` : '';
        button.innerHTML = `<div class="module-title"><span>${escapeHtml(module.title)}</span><span>${count}</span></div>
          <div class="mini">${module.summary.eventCount} 个事件 · ${module.summary.paramCount} 个参数${flowMeta}</div>`;
        button.addEventListener('click', () => {
          activeModuleIndex = index;
          activeEventId = null;
          clearEdgeSelection();
          render();
        });
        moduleList.appendChild(button);
      });
    }

    function renderPlatformFilter(module) {
      if (!platformFilter) return;
      const platforms = Array.from(new Set(module.events.map(e => e.platform || '未标注'))).sort();
      platformFilter.innerHTML = '<option value="全部">全部平台</option>' + platforms.map(p => `<option value="${escapeAttr(p)}">${escapeHtml(p)}</option>`).join('');
      if (!platforms.includes(activePlatform) && activePlatform !== '全部') activePlatform = '全部';
      platformFilter.value = activePlatform;
    }

    function renderFlow(module) {
      hideParamTooltip();
      const events = filteredEvents(module);
      if (activeView === 'demo') {
        renderDemo(module);
        return;
      }
      cancelHotspotDrawing(null, false);
      if (!events.some(event => event.id === activeEventId)) activeEventId = events[0]?.id || null;
      if (activeView === 'flowchart') {
        renderFlowchart(module, events);
        return;
      }
      const byStage = Object.fromEntries(DATA.stageOrder.map(stage => [stage, []]));
      events.forEach(event => (byStage[event.stage] || byStage['其它']).push(event));
      flow.style.transform = `scale(${zoom})`;
      flow.style.width = `${100 / zoom}%`;
      flow.style.height = 'auto';
      flow.innerHTML = `<div class="stage-grid">${DATA.stageOrder.map(stage => renderStage(stage, byStage[stage] || [])).join('')}</div>`;
      bindEventNodes(module, '.node');
      updateEdgeEditor(module);
      renderDetail(module);
    }

    function renderFlowchart(module, events) {
      const flowEvents = CORE_FLOWCHART
        ? getEditableNodes(module).filter(event => eventMatchesFilters(module, event))
        : events;
      if (!flowEvents.some(event => event.id === activeEventId)) activeEventId = flowEvents[0]?.id || null;
      if (!flowEvents.length) {
        flow.style.transform = 'none';
        flow.style.width = '100%';
        flow.style.height = 'auto';
        activeFlowPositions = new Map();
        currentFlowState = null;
        flow.innerHTML = `<div class="flowchart" style="min-height:320px"><div class="empty">当前筛选条件下没有核心流程节点</div></div>`;
        updateEdgeEditor(module);
        renderDetail(module);
        return;
      }
      const visibleIds = new Set(flowEvents.map(event => event.id));
      const sourceLinks = getEditableLinks(module);
      const links = sourceLinks.filter(link => visibleIds.has(link.source) && visibleIds.has(link.target));
      const columns = CORE_FLOWCHART ? module.coreFlow.columns : DATA.stageOrder;
      const colWidth = CORE_FLOWCHART ? 322 : 220;
      const rowGap = CORE_FLOWCHART ? 34 : 38;
      const nodeWidth = CORE_FLOWCHART ? 250 : 176;
      const topPad = CORE_FLOWCHART ? 74 : 58;
      const leftPad = 30;
      const byColumn = Object.fromEntries(columns.map((column, index) => [index, []]));
      flowEvents.forEach(event => {
        const column = CORE_FLOWCHART
          ? Math.max(0, Math.min(columns.length - 1, Number(event.flowColumn ?? 1)))
          : Math.max(0, DATA.stageOrder.indexOf(event.stage));
        (byColumn[column] || byColumn[columns.length - 1]).push(event);
      });
      const positions = new Map();
      const savedPositions = CORE_FLOWCHART ? getModuleDraft(module).positions : {};
      columns.forEach((column, columnIndex) => {
        let yCursor = topPad;
        byColumn[columnIndex].forEach((event, rowIndex) => {
          const size = getFlowNodeSize(event);
          const saved = savedPositions[event.id];
          const savedScale = saved?.width
            ? Number(saved.width) / size.width
            : saved?.height
              ? Number(saved.height) / size.height
              : 1;
          const nodeScale = clampNodeScale(savedScale);
          const position = {
            x: saved ? Number(saved.x) : leftPad + columnIndex * colWidth,
            y: saved ? Number(saved.y) : yCursor,
            width: Math.round(size.width * nodeScale),
            height: Math.round(size.height * nodeScale),
            baseWidth: size.width,
            baseHeight: size.height,
            column,
          };
          positions.set(event.id, position);
          yCursor += position.height + rowGap;
        });
      });
      const bounds = flowBounds(positions, leftPad, columns.length * colWidth + leftPad * 2, topPad + 420);
      const width = bounds.width;
      const height = bounds.height;
      flow.innerHTML = `<div class="flowchart${CORE_FLOWCHART ? ' core-flowchart' : ''}" style="width:${width}px;height:${height}px${CORE_FLOWCHART ? `;transform:scale(${zoom});transform-origin:top left` : ''}">
        ${CORE_FLOWCHART ? `<div class="flow-note">核心流程视图已隐藏历史、权限、订阅、推送等非核心页面；节点根据埋点名称、触发时机和 UI 图片位置推断为主要功能链路。</div>` : ''}
        <svg class="flowchart-svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">
          <defs>
            <marker id="flowDot" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse">
              <circle cx="4" cy="4" r="3.2" fill="context-stroke"></circle>
            </marker>
            <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
              <path d="M0,0 L0,11 L11,5.5 z" fill="context-stroke"></path>
            </marker>
          </defs>
          <g class="flow-edges">${links.map(link => renderFlowEdge(link, positions)).join('')}</g>
          <path id="edgeDraftLine" class="edge-draft-line" hidden></path>
        </svg>
        ${CORE_FLOWCHART ? '' : columns.map((column, columnIndex) => `<div class='flow-lane-label' style="left:${leftPad + columnIndex * colWidth}px;width:${nodeWidth}px">${escapeHtml(column)} · ${byColumn[columnIndex].length}</div>`).join('')}
        ${flowEvents.map(event => renderFlowchartNode(event, positions.get(event.id))).join('')}
        ${CORE_FLOWCHART ? '' : links.map(link => renderFlowEdgeLabel(link, positions)).join('')}
      </div>`;
      applyFlowZoom(width, height);
      activeFlowPositions = positions;
      currentFlowState = { module, positions, width, height };
      bindFlowCanvas(module);
      bindEventNodes(module, '.flowchart-node');
      bindFlowEdges(module);
      updateEdgeEditor(module);
      requestAnimationFrame(adjustFlowNodeTextWidths);
      renderDetail(module);
    }

    function getFlowNodeSize(event) {
      if (!CORE_FLOWCHART) return { width: 176, height: 112 };
      const mediaSize = flowMediaSize(event.uiImages?.[0]);
      const titleTextWidth = Math.max(48, mediaSize.width - 16);
      const nameLines = Math.max(1, Math.ceil(String(event.name || '').length * 6.2 / titleTextWidth));
      const triggerLines = Math.max(1, Math.ceil(String(event.trigger || '').length * 5.8 / titleTextWidth));
      const textHeight = 17 + nameLines * 16 + triggerLines * 15;
      return {
        width: mediaSize.width,
        height: Math.max(textHeight + mediaSize.height, textHeight + 180),
      };
    }

    function clampNodeScale(value) {
      return Math.max(0.55, Math.min(2.4, Number(value) || 1));
    }

    function nodeScaleFromPosition(position) {
      const baseWidth = Math.max(1, Number(position.baseWidth || position.width || 1));
      return clampNodeScale(Number(position.width || baseWidth) / baseWidth);
    }

    function flowBounds(positions, leftPad, minWidth, minHeight) {
      const values = Array.from(positions.values());
      const maxRight = Math.max(minWidth, ...values.map(position => position.x + position.width + leftPad));
      const maxBottom = Math.max(minHeight, ...values.map(position => position.y + position.height + 40));
      return { width: Math.ceil(maxRight), height: Math.ceil(maxBottom) };
    }

    function clampZoom(value) {
      return Math.max(0.35, Math.min(2.6, value));
    }

    function applyFlowZoom(width, height) {
      if (CORE_FLOWCHART && activeView === 'flowchart') {
        const chart = flow.querySelector('.flowchart');
        flow.style.transform = 'none';
        flow.style.width = `${Math.ceil(width * zoom)}px`;
        flow.style.height = `${Math.ceil(height * zoom)}px`;
        if (chart) {
          chart.style.transform = `scale(${zoom})`;
          chart.style.transformOrigin = 'top left';
        }
        return;
      }
      flow.style.transform = `scale(${zoom})`;
      flow.style.width = `${width / zoom}px`;
      flow.style.height = 'auto';
    }

    function setCanvasZoom(nextZoom, clientX, clientY) {
      const next = clampZoom(nextZoom);
      if (!CORE_FLOWCHART || activeView !== 'flowchart' || !canvasElement || !currentFlowState) {
        zoom = next;
        renderFlow(DATA.modules[activeModuleIndex]);
        return;
      }
      const rect = canvasElement.getBoundingClientRect();
      const focalX = clientX ?? rect.left + rect.width / 2;
      const focalY = clientY ?? rect.top + rect.height / 2;
      const contentX = (canvasElement.scrollLeft + focalX - rect.left) / zoom;
      const contentY = (canvasElement.scrollTop + focalY - rect.top) / zoom;
      zoom = next;
      applyFlowZoom(currentFlowState.width, currentFlowState.height);
      canvasElement.scrollLeft = contentX * zoom - (focalX - rect.left);
      canvasElement.scrollTop = contentY * zoom - (focalY - rect.top);
    }

    function zoomCanvasBy(factor, clientX, clientY) {
      setCanvasZoom(zoom * factor, clientX, clientY);
    }

    function moveCanvasPan(event) {
      if (!canvasPan || !canvasElement) return;
      const dx = event.clientX - canvasPan.startClientX;
      const dy = event.clientY - canvasPan.startClientY;
      if (Math.abs(dx) + Math.abs(dy) <= 3 && !canvasPan.moved) return;
      canvasPan.moved = true;
      suppressCanvasClick = true;
      canvasElement.classList.add('panning');
      canvasElement.scrollLeft = canvasPan.startScrollLeft - dx;
      canvasElement.scrollTop = canvasPan.startScrollTop - dy;
      event.preventDefault();
    }

    function finishCanvasPan() {
      if (!canvasPan) return;
      const moved = canvasPan.moved;
      canvasElement?.classList.remove('panning');
      canvasPan = null;
      if (moved) setTimeout(() => { suppressCanvasClick = false; }, 0);
    }

    function bindCoreCanvasNavigation() {
      if (!canvasElement || !CORE_FLOWCHART) return;
      canvasElement.addEventListener('wheel', event => {
        if (activeView !== 'flowchart') return;
        if (event.ctrlKey) {
          event.preventDefault();
          zoomCanvasBy(Math.exp(-event.deltaY * 0.002), event.clientX, event.clientY);
        }
      }, { passive: false });
      canvasElement.addEventListener('pointerdown', event => {
        if (activeView !== 'flowchart' || event.button !== 0) return;
        if (event.target.closest('.flowchart-node') || event.target.closest('.flow-edge-group') || event.target.closest('.edge-handle') || event.target.closest('.resize-handle')) return;
        canvasPan = {
          startClientX: event.clientX,
          startClientY: event.clientY,
          startScrollLeft: canvasElement.scrollLeft,
          startScrollTop: canvasElement.scrollTop,
          moved: false,
        };
      });
      canvasElement.addEventListener('gesturestart', event => {
        if (activeView !== 'flowchart') return;
        event.preventDefault();
        gestureZoomStart = zoom;
      }, { passive: false });
      canvasElement.addEventListener('gesturechange', event => {
        if (activeView !== 'flowchart' || gestureZoomStart === null) return;
        event.preventDefault();
        setCanvasZoom(gestureZoomStart * event.scale, event.clientX, event.clientY);
      }, { passive: false });
      canvasElement.addEventListener('gestureend', () => {
        gestureZoomStart = null;
      });
    }

    function getFlowEdgeGeometry(link, positions) {
      const source = positions.get(link.source);
      const target = positions.get(link.target);
      if (!source || !target) return null;
      const sameColumn = Math.abs((target.x + target.width / 2) - (source.x + source.width / 2)) < 1;
      const targetBelow = target.y + target.height / 2 >= source.y + source.height / 2;
      const targetRight = target.x + target.width / 2 >= source.x + source.width / 2;
      const sourceSide = sameColumn ? (targetBelow ? 'bottom' : 'top') : (targetRight ? 'right' : 'left');
      const targetSide = sameColumn ? (targetBelow ? 'top' : 'bottom') : (targetRight ? 'left' : 'right');
      const start = edgeMidpoint(source, link.sourceSide || sourceSide);
      const end = edgeMidpoint(target, link.targetSide || targetSide);
      const horizontal = (link.sourceSide || sourceSide) === 'left' || (link.sourceSide || sourceSide) === 'right';
      const mid = horizontal ? (start.x + end.x) / 2 : (start.y + end.y) / 2;
      const path = horizontal
        ? `M ${start.x} ${start.y} C ${mid} ${start.y}, ${mid} ${end.y}, ${end.x} ${end.y}`
        : `M ${start.x} ${start.y} C ${start.x} ${mid}, ${end.x} ${mid}, ${end.x} ${end.y}`;
      const lx = horizontal ? mid : (start.x + end.x) / 2;
      const ly = horizontal ? (start.y + end.y) / 2 : mid;
      return { path, lx, ly };
    }

    function edgeMidpoint(position, side) {
      return {
        left: { x: position.x, y: position.y + position.height / 2 },
        right: { x: position.x + position.width, y: position.y + position.height / 2 },
        top: { x: position.x + position.width / 2, y: position.y },
        bottom: { x: position.x + position.width / 2, y: position.y + position.height },
      }[side];
    }

    function renderFlowEdge(link, positions) {
      const geometry = getFlowEdgeGeometry(link, positions);
      if (!geometry) return '';
      const titleHtml = CORE_FLOWCHART ? '' : `<title>${escapeHtml(link.reason)} · 置信度 ${link.confidence}</title>`;
      const key = edgeKey(link);
      return `<g class="flow-edge-group${key === selectedEdgeKey ? ' selected' : ''}" data-edge-key="${escapeAttr(key)}">
        <path class="flow-edge-hit" d="${geometry.path}"></path>
        <path class="flow-edge" d="${geometry.path}" marker-start="url(#flowDot)" marker-end="url(#arrow)">${titleHtml}</path>
      </g>`;
    }

    function renderFlowEdgeLabel(link, positions) {
      const geometry = getFlowEdgeGeometry(link, positions);
      if (!geometry) return '';
      return `<div class="flow-edge-chip" style="left:${geometry.lx}px;top:${geometry.ly}px">${escapeHtml(shortText(link.label, 16))}</div>`;
    }

    function renderFlowEdges() {
      if (!currentFlowState) return;
      const edgeLayer = flow.querySelector('.flow-edges');
      if (!edgeLayer) return;
      const visibleIds = new Set(currentFlowState.positions.keys());
      const links = getEditableLinks(currentFlowState.module).filter(link => visibleIds.has(link.source) && visibleIds.has(link.target));
      edgeLayer.innerHTML = links.map(link => renderFlowEdge(link, currentFlowState.positions)).join('');
      bindFlowEdges(currentFlowState.module);
      updateEdgeSelection();
    }

    function bindFlowCanvas(module) {
      if (!CORE_FLOWCHART || activeView !== 'flowchart') return;
      const chart = flow.querySelector('.flowchart');
      if (!chart) return;
      chart.addEventListener('click', event => {
        if (suppressCanvasClick) {
          suppressCanvasClick = false;
          return;
        }
        if (event.target.closest('.flowchart-node') || event.target.closest('.flow-edge-group')) return;
        clearFlowSelection();
      });
      chart.addEventListener('dblclick', event => {
        if (event.target.closest('.flowchart-node') || event.target.closest('.flow-edge-group')) return;
        const point = flowPointFromEvent(event);
        pendingCreatePosition = { x: Math.max(20, point.x), y: Math.max(54, point.y) };
        openEventPicker();
      });
    }

    function flowPointFromEvent(event) {
      const chart = flow.querySelector('.flowchart');
      const rect = chart.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left) / zoom,
        y: (event.clientY - rect.top) / zoom,
      };
    }

    function bindNodeDragging(module, node) {
      node.addEventListener('pointerdown', event => {
        if (!CORE_FLOWCHART || activeView !== 'flowchart') return;
        if (event.button !== 0 || event.target.closest('.edge-handle') || event.target.closest('.resize-handle')) return;
        const position = activeFlowPositions.get(node.dataset.eventId);
        if (!position) return;
        nodeDrag = {
          id: node.dataset.eventId,
          node,
          startClientX: event.clientX,
          startClientY: event.clientY,
          startX: position.x,
          startY: position.y,
          beforeDraft: snapshotModuleDraft(module),
          moved: false,
        };
        node.classList.add('dragging');
        event.preventDefault();
      });
    }

    function bindNodeResizing(module, node) {
      node.querySelectorAll('.resize-handle').forEach(handle => {
        handle.addEventListener('pointerdown', event => startNodeResize(module, handle, event));
      });
    }

    function startNodeResize(module, handle, event) {
      if (!CORE_FLOWCHART || activeView !== 'flowchart' || event.button !== 0) return;
      const node = handle.closest('.flowchart-node');
      const eventId = node?.dataset.eventId;
      const position = eventId ? activeFlowPositions.get(eventId) : null;
      if (!node || !eventId || !position) return;
      hideParamTooltip();
      event.stopPropagation();
      event.preventDefault();
      nodeResize = {
        id: eventId,
        node,
        corner: handle.dataset.corner,
        startClientX: event.clientX,
        startClientY: event.clientY,
        startX: position.x,
        startY: position.y,
        startWidth: position.width,
        startHeight: position.height,
        baseWidth: position.baseWidth || position.width,
        baseHeight: position.baseHeight || position.height,
        aspect: position.height / Math.max(1, position.width),
        beforeDraft: snapshotModuleDraft(module),
        moved: false,
      };
      node.classList.add('resizing');
    }

    function moveActiveNode(event) {
      if (!nodeDrag || !currentFlowState) return;
      const dx = (event.clientX - nodeDrag.startClientX) / zoom;
      const dy = (event.clientY - nodeDrag.startClientY) / zoom;
      if (Math.abs(dx) + Math.abs(dy) > 2) nodeDrag.moved = true;
      const x = Math.max(8, nodeDrag.startX + dx);
      const y = Math.max(54, nodeDrag.startY + dy);
      const position = currentFlowState.positions.get(nodeDrag.id);
      if (!position) return;
      position.x = x;
      position.y = y;
      applyFlowNodeRect(nodeDrag.node, position);
      renderFlowEdges();
    }

    function finishActiveNodeDrag() {
      if (!nodeDrag) return;
      const module = DATA.modules[activeModuleIndex];
      const position = currentFlowState?.positions.get(nodeDrag.id);
      nodeDrag.node.classList.remove('dragging');
      if (position && nodeDrag.moved) {
        setEditablePosition(module, nodeDrag.id, position);
        recordFlowEdit(module, nodeDrag.beforeDraft, '位置已调整，记得保存');
        suppressNextNodeClick = true;
        setTimeout(() => { suppressNextNodeClick = false; }, 0);
      }
      nodeDrag = null;
    }

    function moveActiveNodeResize(event) {
      if (!nodeResize || !currentFlowState) return;
      const dx = (event.clientX - nodeResize.startClientX) / zoom;
      const dy = (event.clientY - nodeResize.startClientY) / zoom;
      const corner = nodeResize.corner || 'se';
      const xDirection = corner.includes('e') ? 1 : -1;
      const yDirection = corner.includes('s') ? 1 : -1;
      const widthFromX = nodeResize.startWidth + xDirection * dx;
      const widthFromY = (nodeResize.startHeight + yDirection * dy) / Math.max(0.01, nodeResize.aspect);
      const preferredWidth = Math.abs(widthFromX - nodeResize.startWidth) >= Math.abs(widthFromY - nodeResize.startWidth)
        ? widthFromX
        : widthFromY;
      const minWidth = Math.max(48, nodeResize.baseWidth * 0.55);
      const maxWidth = Math.max(minWidth, nodeResize.baseWidth * 2.4);
      const width = Math.max(minWidth, Math.min(maxWidth, preferredWidth));
      const height = width * nodeResize.aspect;
      const position = currentFlowState.positions.get(nodeResize.id);
      if (!position) return;
      position.width = width;
      position.height = height;
      position.x = corner.includes('w') ? Math.max(8, nodeResize.startX + nodeResize.startWidth - width) : nodeResize.startX;
      position.y = corner.includes('n') ? Math.max(54, nodeResize.startY + nodeResize.startHeight - height) : nodeResize.startY;
      position.baseWidth = nodeResize.baseWidth;
      position.baseHeight = nodeResize.baseHeight;
      nodeResize.moved = Math.abs(width - nodeResize.startWidth) > 1 || Math.abs(height - nodeResize.startHeight) > 1;
      applyFlowNodeRect(nodeResize.node, position);
      renderFlowEdges();
      event.preventDefault();
    }

    function finishActiveNodeResize() {
      if (!nodeResize) return;
      const module = DATA.modules[activeModuleIndex];
      const position = currentFlowState?.positions.get(nodeResize.id);
      nodeResize.node.classList.remove('resizing');
      if (position && nodeResize.moved) {
        setEditableNodeRect(module, nodeResize.id, position);
        recordFlowEdit(module, nodeResize.beforeDraft, '尺寸已调整，记得保存');
        suppressNextNodeClick = true;
        setTimeout(() => { suppressNextNodeClick = false; }, 0);
      }
      nodeResize = null;
    }

    function bindEdgeHandle(module, handle) {
      handle.addEventListener('pointerdown', event => {
        startEdgeDraft(module, handle, event);
      });
    }

    function startEdgeDraft(module, handle, event) {
      if (!CORE_FLOWCHART || activeView !== 'flowchart' || event.button !== 0) return;
      const node = handle.closest('.flowchart-node');
      const sourceId = node?.dataset.eventId;
      const source = sourceId ? activeFlowPositions.get(sourceId) : null;
      if (!source) return;
      event.stopPropagation();
      event.preventDefault();
      const sourceSide = handle.dataset.side;
      edgeDraft = {
        sourceId,
        sourceSide,
        start: edgeMidpoint(source, sourceSide),
        current: edgeMidpoint(source, sourceSide),
        targetId: null,
        targetSide: null,
      };
      selectedEdgeKey = null;
      flow.querySelector('.flowchart')?.classList.add('is-connecting');
      updateEdgeDraftLine();
    }

    function moveEdgeDraft(event) {
      if (!edgeDraft) return;
      const point = flowPointFromEvent(event);
      const targetHandle = handleFromPoint(event.clientX, event.clientY, edgeDraft.sourceId);
      flow.querySelectorAll('.edge-handle').forEach(handle => handle.classList.toggle('snapped', handle === targetHandle));
      if (targetHandle) {
        const targetId = targetHandle.closest('.flowchart-node').dataset.eventId;
        const target = activeFlowPositions.get(targetId);
        edgeDraft.targetId = targetId;
        edgeDraft.targetSide = targetHandle.dataset.side;
        edgeDraft.current = edgeMidpoint(target, edgeDraft.targetSide);
      } else {
        edgeDraft.targetId = null;
        edgeDraft.targetSide = null;
        edgeDraft.current = point;
      }
      updateEdgeDraftLine();
    }

    function finishEdgeDraft() {
      if (!edgeDraft) return;
      const module = DATA.modules[activeModuleIndex];
      if (edgeDraft.targetId && edgeDraft.targetId !== edgeDraft.sourceId) {
        const beforeDraft = snapshotModuleDraft(module);
        const links = getEditableLinks(module);
        const nextLink = {
          source: edgeDraft.sourceId,
          target: edgeDraft.targetId,
          sourceSide: edgeDraft.sourceSide,
          targetSide: edgeDraft.targetSide,
          label: '手动连线',
          reason: '用户手动拖拽添加',
          confidence: 100,
          manual: true,
        };
        const nextKey = edgeKey(nextLink);
        if (!links.some(link => edgeKey(link) === nextKey)) {
          links.push(nextLink);
          setEditableLinks(module, links);
          selectedEdgeKey = nextKey;
          recordFlowEdit(module, beforeDraft, '已添加连线，记得保存');
        } else {
          setEdgeStatus('这条连线已存在');
        }
        renderFlowEdges();
      }
      hideEdgeDraftLine();
      flow.querySelector('.flowchart')?.classList.remove('is-connecting');
      flow.querySelectorAll('.edge-handle').forEach(handle => handle.classList.remove('snapped'));
      edgeDraft = null;
    }

    function updateEdgeDraftLine() {
      const draftLine = $('edgeDraftLine');
      if (!draftLine || !edgeDraft) return;
      const start = edgeDraft.start;
      const end = edgeDraft.current;
      const horizontal = edgeDraft.sourceSide === 'left' || edgeDraft.sourceSide === 'right';
      const mid = horizontal ? (start.x + end.x) / 2 : (start.y + end.y) / 2;
      const path = horizontal
        ? `M ${start.x} ${start.y} C ${mid} ${start.y}, ${mid} ${end.y}, ${end.x} ${end.y}`
        : `M ${start.x} ${start.y} C ${start.x} ${mid}, ${end.x} ${mid}, ${end.x} ${end.y}`;
      draftLine.setAttribute('d', path);
      draftLine.hidden = false;
    }

    function hideEdgeDraftLine() {
      const draftLine = $('edgeDraftLine');
      if (!draftLine) return;
      draftLine.hidden = true;
      draftLine.removeAttribute('d');
    }

    function handleFromPoint(clientX, clientY, sourceId) {
      const element = document.elementFromPoint(clientX, clientY);
      const handle = element?.closest?.('.edge-handle');
      const node = handle?.closest?.('.flowchart-node');
      if (handle && node && node.dataset.eventId !== sourceId) return handle;
      let nearest = null;
      let nearestDistance = Infinity;
      flow.querySelectorAll('.edge-handle').forEach(candidate => {
        const candidateNode = candidate.closest('.flowchart-node');
        if (!candidateNode || candidateNode.dataset.eventId === sourceId) return;
        const rect = candidate.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        const distance = Math.hypot(clientX - centerX, clientY - centerY);
        if (distance < nearestDistance) {
          nearest = candidate;
          nearestDistance = distance;
        }
      });

    function setCheckUpdateState(isLoading, statusText) {

        checkUpdateButton.setAttribute('aria-busy', isLoading ? 'true' : 'false');

    async function checkForUpdates() {
      if (!UPDATE_ENDPOINT) {
        setEdgeStatus('更新服务未配置');
        return;
      }
      setCheckUpdateState(true, '正在检查更新...');
      try {
        const response = await fetch(UPDATE_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'publish', source: DATA.source }),
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || payload.ok === false) {
          throw new Error(payload.error || payload.message || `更新失败 (${response.status})`);
        }
        const reloadDelayMs = Number(payload.reloadDelayMs || 0);
        setEdgeStatus(reloadDelayMs > 0 ? '已开始更新，稍后自动刷新...' : '更新完成，正在刷新...');
        const refreshPage = () => {
          const refreshedUrl = new URL(window.location.href);
          refreshedUrl.searchParams.set('updated', Date.now().toString());
          window.location.replace(refreshedUrl.toString());
        };
        if (reloadDelayMs > 0) {
          window.setTimeout(refreshPage, reloadDelayMs);
        } else {
          refreshPage();
        }
      } catch (error) {
        setCheckUpdateState(false, error?.message || '更新失败');
      }
    }

    function flowMediaSize(image) {
      const fallback = { width: 250, height: 180 };
      if (!image?.width || !image?.height) return fallback;
      const naturalWidth = Number(image.width);
      const naturalHeight = Number(image.height);
      if (!naturalWidth || !naturalHeight) return fallback;
      const scale = Math.min(1, 250 / naturalWidth, 330 / naturalHeight);
      return {
        width: Math.max(48, Math.round(naturalWidth * scale)),
        height: Math.max(48, Math.round(naturalHeight * scale)),
      };
    }

    function flowMediaWidth(image) {
      return flowMediaSize(image).width;
    }

    function scaleFlowNodeTypography(node, position) {
      const nodeScale = nodeScaleFromPosition(position);
      node.style.setProperty('--node-scale', nodeScale.toFixed(3));

      const nodeScale = scaleFlowNodeTypography(node, position);
      const baseMediaHeight = Number(node.dataset.baseMediaHeight) || 180;
      node.style.left = `${Math.round(position.x)}px`;
      node.style.top = `${Math.round(position.y)}px`;
      node.style.width = `${Math.round(position.width)}px`;
      node.style.height = `${Math.round(position.height)}px`;
      node.style.setProperty('--flow-media-width', `${Math.round(position.width)}px`);
      node.style.setProperty('--flow-media-height', `${Math.round(baseMediaHeight * nodeScale)}px`);

      return {

    function renderHotspotDrawToolbar() {
      const shape = hotspotDraw?.shape || 'rect';
      return `<div class="demo-draw-toolbar" role="toolbar" aria-label="绘制点击热区">
        <span class="demo-draw-toolbar-label">绘制形状</span>
        <button type="button" class="${shape === 'rect' ? 'active' : ''}" data-hotspot-shape="rect">方形</button>
        <button type="button" class="${shape === 'circle' ? 'active' : ''}" data-hotspot-shape="circle">圆形</button>

        <button class="cancel" type="button" data-hotspot-action="cancel">退出</button>

    function clamp01(value) {
      return Math.max(0, Math.min(1, Number(value) || 0));
    }

    function sanitizeHotspotShape(shape) {
      const x = clamp01(shape.x);
      const y = clamp01(shape.y);
      const width = Math.max(0, Math.min(1 - x, Number(shape.width) || 0));
      const height = Math.max(0, Math.min(1 - y, Number(shape.height) || 0));
      return { type: shape.type === 'circle' ? 'circle' : 'rect', x, y, width, height };
    }

    function renderHotspotShape(shape) {
      const safeShape = sanitizeHotspotShape(shape);
      if (safeShape.width <= 0 || safeShape.height <= 0) return '';
      const typeClass = safeShape.type === 'circle' ? 'demo-hotspot-circle' : 'demo-hotspot-rect';
      return `<div class="demo-hotspot-shape ${typeClass}" style="left:${safeShape.x * 100}%;top:${safeShape.y * 100}%;width:${safeShape.width * 100}%;height:${safeShape.height * 100}%"></div>`;
    }

    function renderDemoHotspotLayers() {
      const savedLayer = flow.querySelector('.demo-hotspot-saved');
      const draftLayer = flow.querySelector('.demo-hotspot-draft');
      if (savedLayer) {
        const visibleHotspotKey = !hotspotDraw ? (hoveredStageHotspotKey || hoveredHotspotKey) : null;
        const savedShapes = visibleHotspotKey ? (demoHotspots[visibleHotspotKey] || []) : [];
        savedLayer.innerHTML = savedShapes.map(renderHotspotShape).join('');
      }
      if (draftLayer) {
        const draftShapes = hotspotDraw ? [...hotspotDraw.shapes, hotspotDraw.preview].filter(Boolean) : [];
        draftLayer.innerHTML = draftShapes.map(renderHotspotShape).join('');
      }
    }

    function beginHotspotDrawing(module, sourceId, targetId) {
      if (!sourceId || !targetId) return;
      hotspotDraw = {
        sourceId,
        targetId,
        shape: 'rect',
        shapes: [],
        preview: null,
        start: null,
      };
      hoveredHotspotKey = null;
      activeEventId = sourceId;
      selectedEdgeKey = null;
      renderDemo(module);
    }

    function finishHotspotDrawing(module) {
      if (!hotspotDraw) return;
      const key = demoHotspotKey(hotspotDraw.sourceId, hotspotDraw.targetId);
      const shapes = hotspotDraw.shapes.map(sanitizeHotspotShape).filter(shape => shape.width >= 0.01 && shape.height >= 0.01);
      if (shapes.length) {
        demoHotspots[key] = shapes;
      } else {
        delete demoHotspots[key];
      }
      saveDemoHotspots();
      hotspotDraw = null;
      hoveredHotspotKey = null;
      hoveredStageHotspotKey = null;
      renderDemo(module);
    }

    function cancelHotspotDrawing(module, shouldRender = true) {
      hotspotDraw = null;
      hoveredHotspotKey = null;
      hoveredStageHotspotKey = null;
      if (shouldRender && module) renderDemo(module);
    }

    function deleteDemoHotspots(sourceId, targetId) {
      const key = demoHotspotKey(sourceId, targetId);
      delete demoHotspots[key];
      if (hoveredHotspotKey === key) hoveredHotspotKey = null;
      if (hoveredStageHotspotKey === key) hoveredStageHotspotKey = null;
      saveDemoHotspots();
      renderDemoHotspotLayers();
    }

    function showDemoHotspots(sourceId, targetId) {
      if (hotspotDraw || !sourceId || !targetId) return;
      hoveredHotspotKey = demoHotspotKey(sourceId, targetId);
      hoveredStageHotspotKey = null;
      renderDemoHotspotLayers();
    }

    function clearDemoHotspots() {
      if (hotspotDraw) return;
      hoveredHotspotKey = null;
      renderDemoHotspotLayers();
    }

    function stagePointFromEvent(event) {
      const stage = flow.querySelector('.demo-hotspot-stage');
      const rect = stage.getBoundingClientRect();
      return {
        x: clamp01((event.clientX - rect.left) / Math.max(1, rect.width)),
        y: clamp01((event.clientY - rect.top) / Math.max(1, rect.height)),
      };
    }

    function normalizeHotspotShape(type, start, current) {
      if (!start || !current) return null;
      const left = Math.min(start.x, current.x);
      const top = Math.min(start.y, current.y);
      let width = Math.abs(current.x - start.x);
      let height = Math.abs(current.y - start.y);
      if (type === 'circle') {
        const side = Math.max(width, height);
        width = Math.min(side, 1 - left);
        height = Math.min(side, 1 - top);
      }
      return sanitizeHotspotShape({ type, x: left, y: top, width, height });
    }

    function pointInHotspotShape(point, shape) {
      const safeShape = sanitizeHotspotShape(shape);
      if (safeShape.width <= 0 || safeShape.height <= 0) return false;
      const insideBounds = point.x >= safeShape.x
        && point.x <= safeShape.x + safeShape.width
        && point.y >= safeShape.y
        && point.y <= safeShape.y + safeShape.height;
      if (!insideBounds) return false;
      if (safeShape.type !== 'circle') return true;
      const radiusX = safeShape.width / 2;
      const radiusY = safeShape.height / 2;
      if (!radiusX || !radiusY) return false;
      const centerX = safeShape.x + radiusX;
      const centerY = safeShape.y + radiusY;
      const dx = (point.x - centerX) / radiusX;
      const dy = (point.y - centerY) / radiusY;
      return dx * dx + dy * dy <= 1;
    }

    function findDemoHotspotTarget(module, sourceId, point) {
      const { downstreamNodes } = getDemoNeighbors(module, sourceId);
      for (const target of downstreamNodes) {
        const shapes = demoHotspots[demoHotspotKey(sourceId, target.id)] || [];
        if (shapes.some(shape => pointInHotspotShape(point, shape))) return target.id;
      }
      return null;
    }

    function updateDemoHotspotTargetCard(targetId) {

    function updateDemoStageHotspotHover(module, sourceId, event) {

      hoveredStageHotspotKey = targetId ? demoHotspotKey(sourceId, targetId) : null;
      stage.classList.toggle('hotspot-link', Boolean(targetId));
      updateDemoHotspotTargetCard(targetId);
      renderDemoHotspotLayers();
    }

    function clearDemoStageHotspotHover() {
      const stage = flow.querySelector('.demo-hotspot-stage');
      hoveredStageHotspotKey = null;
      stage?.classList.remove('hotspot-link');
      updateDemoHotspotTargetCard(null);
      renderDemoHotspotLayers();
