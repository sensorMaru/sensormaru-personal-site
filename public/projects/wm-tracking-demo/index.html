<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>埋点可视化示意版</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #d8dee9;
      --soft: #eef2f7;
      --brand: #0f766e;
      --brand-2: #2563eb;
      --accent: #c2410c;
      --ok: #15803d;
      --bad: #b42318;
      --shadow: 0 12px 30px rgba(15, 23, 42, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    button, input, select { font: inherit; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 300px minmax(520px, 1fr) 360px; }
    .core-app.is-flowchart,
    .core-app.is-demo { grid-template-columns: 300px minmax(760px, 1fr); }
    .core-app.is-stage { grid-template-columns: 300px minmax(520px, 1fr) 360px; }
    .core-app.is-flowchart .detail,
    .core-app.is-demo .detail { display: none; }
    aside, main, .detail { min-width: 0; }
    aside {
      border-right: 1px solid var(--line);
      background: #fbfcfe;
      padding: 18px 14px;
      overflow: auto;
      max-height: 100vh;
      position: sticky;
      top: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .mark { width: 34px; height: 34px; border-radius: 8px; background: var(--brand); color: white; display: grid; place-items: center; font-weight: 800; }
    h1 { font-size: 18px; margin: 0; line-height: 1.25; }
    .source { color: var(--muted); font-size: 12px; margin-top: 4px; overflow-wrap: anywhere; }
    .search { width: 100%; border: 1px solid var(--line); background: white; border-radius: 8px; padding: 10px 12px; outline: none; }
    .module-list { margin-top: 14px; display: grid; gap: 8px; }
    .module-btn {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      text-align: left;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
    }
    .module-btn:hover { background: var(--soft); }
    .module-btn.active { background: white; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(15, 118, 110, .12); }
    .module-title { display: flex; justify-content: space-between; gap: 12px; align-items: center; font-weight: 700; }
    .mini { color: var(--muted); font-size: 12px; margin-top: 4px; }
    main { padding: 18px; overflow: auto; max-height: 100vh; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .headline h2 { margin: 0; font-size: 24px; }
    .stats { display: flex; gap: 8px; flex-wrap: wrap; }
    .stat { background: white; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 92px; }
    .stat strong { display: block; font-size: 18px; }
    .stat span { color: var(--muted); font-size: 12px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
    .view-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; background: white; overflow: hidden; }
    .view-btn {
      border: 0;
      background: white;
      min-height: 36px;
      padding: 7px 12px;
      cursor: pointer;
      border-right: 1px solid var(--line);
    }
    .view-btn:last-child { border-right: 0; }
    .view-btn.active { background: #ecfdf5; color: #064e3b; font-weight: 750; }
    .chip, .icon-btn {
      border: 1px solid var(--line);
      background: white;
      border-radius: 8px;
      min-height: 36px;
      padding: 7px 10px;
      cursor: pointer;
    }
    .chip.active { background: #ecfdf5; border-color: var(--brand); color: #064e3b; }
    .icon-btn { width: 38px; padding: 0; display: grid; place-items: center; }
    .edge-editor { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .edge-editor[hidden] { display: none; }
    .tool-btn {
      border: 1px solid var(--line);
      background: white;
      border-radius: 8px;
      min-height: 36px;
      padding: 7px 10px;
      cursor: pointer;
      color: #344054;
    }
    .tool-btn.primary { background: #0f766e; border-color: #0f766e; color: white; }
    .tool-btn.active { background: #ecfdf5; border-color: #0f766e; color: #064e3b; font-weight: 750; }
    .tool-btn:disabled { cursor: not-allowed; color: #98a2b3; background: #f8fafc; }
    .editor-status { min-width: 120px; color: var(--muted); font-size: 12px; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1100;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(15, 23, 42, .24);
    }
    .modal-backdrop[hidden] { display: none; }
    .event-picker {
      width: min(920px, calc(100vw - 48px));
      max-height: min(620px, calc(100vh - 48px));
      display: grid;
      grid-template-rows: auto auto auto minmax(120px, 1fr);
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      box-shadow: 0 24px 70px rgba(15, 23, 42, .24);
    }
    .event-picker-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .global-search-toggle {
      display: inline-flex;
      width: max-content;
      align-items: center;
      gap: 8px;
      color: #344054;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .global-search-toggle input { width: 16px; height: 16px; accent-color: var(--brand); }
    .modal-close {
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }
    .event-search { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; outline: none; }
    .event-picker-body {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(240px, 340px);
      gap: 12px;
    }
    .event-results { overflow: auto; display: grid; align-content: start; gap: 8px; }
    .event-result {
      border: 1px solid var(--line);
      background: white;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      text-align: left;
    }
    .event-result:hover,
    .event-result:focus-visible,
    .event-result.previewing { border-color: var(--brand-2); background: #f8fafc; outline: none; }
    .event-result[aria-disabled="true"] { cursor: not-allowed; opacity: .55; }
    .event-picker-preview {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
      overflow: hidden;
      display: grid;
      align-content: start;
      gap: 10px;
      padding: 10px;
    }
    .event-preview-head { display: grid; gap: 4px; }
    .event-preview-title { font-size: 12px; font-weight: 800; line-height: 1.3; overflow-wrap: anywhere; }
    .event-preview-sub { color: var(--muted); font-size: 11px; line-height: 1.35; overflow-wrap: anywhere; }
    .event-preview-main {
      width: 100%;
      max-height: min(420px, 52vh);
      object-fit: contain;
      object-position: top center;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: white;
    }
    .event-preview-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
      gap: 6px;
    }
    .event-preview-thumb {
      width: 100%;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      object-position: top center;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      background: white;
    }
    .event-preview-empty {
      min-height: 240px;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      line-height: 1.45;
      padding: 18px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: white;
    }
    select { min-height: 36px; border: 1px solid var(--line); background: white; border-radius: 8px; padding: 0 10px; }
    .canvas {
      position: relative;
      background: white;
      border: 1px solid var(--line);
      border-radius: 8px;
      min-height: calc(100vh - 154px);
      overflow: auto;
      box-shadow: var(--shadow);
    }
    .core-app.is-flowchart .canvas {
      height: calc(100vh - 154px);
      min-height: 520px;
      overscroll-behavior: contain;
      cursor: default;
      touch-action: none;
    }
    .canvas-export-btn {
      position: sticky;
      top: 12px;
      left: calc(100% - 108px);
      z-index: 120;
      width: 96px;
      min-height: 34px;
      margin: 12px 12px -46px auto;
      display: none;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(15, 118, 110, .28);
      border-radius: 8px;
      background: rgba(255, 255, 255, .96);
      color: #064e3b;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 8px 22px rgba(15, 23, 42, .12);
      cursor: pointer;
    }
    .canvas-export-btn:hover { background: #ecfdf5; border-color: var(--brand); }
    .canvas-export-btn:disabled { cursor: wait; opacity: .68; }
    .core-app.is-flowchart .canvas-export-btn { display: flex; }
    .core-app.is-flowchart .canvas.panning { cursor: grabbing; }
    .core-app.is-flowchart .canvas.panning * { cursor: grabbing !important; }
    .flow { min-width: 880px; padding: 18px; transform-origin: top left; }
    .core-app.is-demo .flow { min-width: 0; }
    .demo-view {
      min-height: calc(100vh - 192px);
      display: grid;
      grid-template-columns: minmax(220px, 280px) minmax(300px, 1fr) minmax(220px, 280px);
      gap: 14px;
      align-items: stretch;
      position: relative;
    }
    .demo-view.hotspot-drawing { isolation: isolate; }
    .demo-side,
    .demo-main {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfe;
    }
    .demo-view.hotspot-drawing .demo-side,
    .demo-view.hotspot-drawing .demo-current-head,
    .demo-view.hotspot-drawing .demo-current-foot {
      pointer-events: none;
      user-select: none;
    }
    .demo-side {
      padding: 12px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
    }
    .demo-side h3,
    .demo-main h3 { margin: 0; font-size: 14px; }
    .demo-neighbor-list {
      min-height: 0;
      display: grid;
      align-content: start;
      gap: 8px;
      overflow: auto;
    }
    .demo-neighbor-card {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      padding: 10px;
      text-align: left;
      cursor: pointer;
      display: grid;
      gap: 8px;
      position: relative;
    }
    .demo-neighbor-card:hover,
    .demo-neighbor-card:focus,
    .demo-neighbor-card:focus-visible {
      border-color: var(--brand-2);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
      outline: none;
    }
    .demo-neighbor-card.downstream { border-color: rgba(15, 118, 110, .28); }
    .demo-neighbor-card.downstream.hotspot-target {
      border-color: #16a34a;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, .22), 0 12px 24px rgba(21, 128, 61, .14);
    }
    .demo-hotspot-actions {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 2px;
    }
    .demo-neighbor-card.downstream:hover .demo-hotspot-actions,
    .demo-neighbor-card.downstream:focus .demo-hotspot-actions,
    .demo-neighbor-card.downstream:focus-within .demo-hotspot-actions {
      display: grid;
    }
    .demo-hotspot-action {
      min-height: 30px;
      border: 1px solid rgba(15, 118, 110, .26);
      border-radius: 8px;
      background: #ecfdf5;
      color: #065f46;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .demo-hotspot-action:hover,
    .demo-hotspot-action:focus-visible {
      border-color: #0f766e;
      background: #d1fae5;
      outline: none;
    }
    .demo-hotspot-action.danger {
      border-color: rgba(220, 38, 38, .22);
      background: #fff1f2;
      color: #991b1b;
    }
    .demo-hotspot-action.danger:hover,
    .demo-hotspot-action.danger:focus-visible {
      border-color: #dc2626;
      background: #ffe4e6;
    }
    .demo-neighbor-media {
      width: 100%;
      aspect-ratio: 9 / 16;
      max-height: 220px;
      display: grid;
      place-items: center;
      overflow: hidden;
      margin-bottom: 10px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #f8fafc;
      color: var(--muted);
      font-size: 12px;
    }
    .demo-neighbor-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: top center;
      background: white;
    }
    .demo-empty {
      min-height: 140px;
      display: grid;
      place-items: center;
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: white;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 14px;
    }
    .demo-main {
      padding: 14px;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 12px;
      background: white;
      position: relative;
      z-index: 2;
    }
    .demo-current-head {
      display: grid;
      gap: 6px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .demo-current-title { font-size: 16px; font-weight: 850; overflow-wrap: anywhere; }
    .demo-current-meta { display: flex; gap: 6px; flex-wrap: wrap; }
    .demo-device {
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: auto;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      padding: 14px;
    }
    .demo-draw-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      background: #f0fdf4;
      padding: 8px;
    }
    .demo-draw-toolbar-label {
      color: #14532d;
      font-size: 12px;
      font-weight: 850;
    }
    .demo-draw-toolbar button {
      min-height: 30px;
      border: 1px solid rgba(15, 118, 110, .26);
      border-radius: 8px;
      background: white;
      color: #064e3b;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .demo-draw-toolbar button.active,
    .demo-draw-toolbar button:hover,
    .demo-draw-toolbar button:focus-visible {
      background: #d1fae5;
      border-color: #0f766e;
      outline: none;
    }
    .demo-draw-toolbar .finish {
      margin-left: auto;
      background: #047857;
      color: white;
      border-color: #047857;
    }
    .demo-draw-toolbar .finish:hover,
    .demo-draw-toolbar .finish:focus-visible { background: #065f46; }
    .demo-draw-toolbar .cancel {
      color: #374151;
      border-color: #d1d5db;
    }
    .demo-hotspot-stage {
      position: relative;
      max-width: 100%;
      max-height: calc(100vh - 340px);
      display: grid;
      place-items: center;
    }
    .demo-hotspot-stage.drawing {
      cursor: crosshair;
      touch-action: none;
    }
    .demo-hotspot-stage.hotspot-link { cursor: pointer; }
    .demo-hotspot-stage .demo-ui-image,
    .demo-hotspot-stage > .demo-empty {
      grid-area: 1 / 1;
    }
    .demo-hotspot-layer {
      grid-area: 1 / 1;
      position: absolute;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      overflow: hidden;
      border-radius: 8px;
    }
    .demo-hotspot-shape {
      position: absolute;
      border: 2px solid rgba(22, 163, 74, .92);
      background: rgba(34, 197, 94, .34);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .72) inset;
    }
    .demo-hotspot-circle { border-radius: 9999px; }
    .hotspot-drawing-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: rgba(15, 23, 42, .34);
      border-radius: 8px;
      pointer-events: auto;
    }
    .demo-ui-image {
      max-width: 100%;
      max-height: calc(100vh - 340px);
      object-fit: contain;
      object-position: top center;
      border-radius: 8px;
      background: white;
      box-shadow: 0 10px 26px rgba(15, 23, 42, .12);
    }
    .demo-current-foot {
      display: grid;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .stage-grid { display: grid; grid-template-columns: repeat(8, minmax(132px, 1fr)); gap: 10px; align-items: start; }
    .stage { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 8px; min-height: 360px; }
    .stage-head { position: sticky; top: 0; z-index: 1; background: #f8fafc; border-bottom: 1px solid #e5e7eb; padding: 10px; border-radius: 8px 8px 0 0; }
    .stage-head strong { display: block; font-size: 13px; }
    .stage-head span { color: var(--muted); font-size: 12px; }
    .nodes { display: grid; gap: 8px; padding: 10px; }
    .node {
      position: relative;
      border: 1px solid var(--line);
      background: white;
      border-radius: 8px;
      padding: 9px;
      cursor: pointer;
      min-height: 76px;
      overflow: hidden;
    }
    .node:hover, .node.active { border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
    .node::after {
      content: "";
      position: absolute;
      right: -10px;
      top: 50%;
      width: 20px;
      height: 1px;
      background: var(--line);
    }
    .stage:last-child .node::after { display: none; }
    .event-name { font-size: 12px; font-weight: 750; line-height: 1.25; word-break: break-word; }
    .event-trigger { color: var(--muted); font-size: 12px; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
    .badge { background: var(--soft); color: #344054; border-radius: 999px; padding: 2px 6px; font-size: 11px; }
    .badge.platform { background: #e0f2fe; color: #075985; }
    .badge.warn { background: #fef3c7; color: #92400e; }
    .flowchart {
      position: relative;
      min-height: 680px;
      cursor: default;
      background:
        linear-gradient(90deg, rgba(216, 222, 233, .55) 1px, transparent 1px) 0 0 / 220px 100%,
        #ffffff;
      border-radius: 8px;
    }
    .flow-note {
      position: absolute;
      left: 30px;
      top: 10px;
      right: 30px;
      color: #475467;
      font-size: 12px;
      line-height: 1.35;
      z-index: 2;
    }
    .flowchart-svg { position: absolute; inset: 0; pointer-events: auto; overflow: visible; z-index: 1; }
    .flow-edge-group { pointer-events: auto; cursor: pointer; }
    .flow-edge-hit { fill: none; stroke: transparent; stroke-width: 18; pointer-events: stroke; cursor: pointer; }
    .flow-edge {
      fill: none;
      stroke: #94a3b8;
      stroke-width: 1.8;
      pointer-events: none;
      transition: stroke .16s ease, stroke-width .16s ease;
    }
    .flow-edge-group.selected .flow-edge {
      stroke: #0f766e;
      stroke-width: 3;
      stroke-dasharray: none;
      animation: none;
    }
    .edge-draft-line {
      fill: none;
      stroke: #0f766e;
      stroke-width: 2.6;
      stroke-dasharray: 7 6;
      pointer-events: none;
    }
    .flow-edge-label { font-size: 11px; fill: #475467; paint-order: stroke; stroke: white; stroke-width: 4px; stroke-linejoin: round; }
    .flow-edge-chip {
      position: absolute;
      z-index: 9;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .96);
      border: 1px solid #d8dee9;
      color: #475467;
      font-size: 11px;
      line-height: 1.35;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 2px 8px rgba(15, 23, 42, .08);
      transform: translate(-50%, -50%);
    }
    .flow-lane-label {
      position: absolute;
      top: 10px;
      height: 28px;
      padding: 6px 10px;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      color: #344054;
      font-size: 12px;
      font-weight: 800;
      z-index: 2;
    }
    .core-flowchart .flow-lane-label { top: 42px; }
    .flowchart-node {
      position: absolute;
      width: 176px;
      min-height: 112px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      padding: 8px;
      box-shadow: 0 8px 18px rgba(15, 23, 42, .07);
      cursor: pointer;
      z-index: 20;
    }
    .core-flowchart .flowchart-node {
      width: var(--flow-media-width, 250px);
      border: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow: visible;
    }
    .core-flowchart .flowchart-node.dragging { opacity: .92; cursor: grabbing; z-index: 30; }
    .core-flowchart .flowchart-node.resizing { opacity: .94; z-index: 31; }
    .core-flowchart .flowchart-node:hover,
    .core-flowchart .flowchart-node.active {
      outline: 2px solid var(--brand-2);
      outline-offset: 0;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }
    .flowchart-node:hover, .flowchart-node.active { border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(37, 99, 235, .12); }
    .flowchart-node.edge-source {
      border-color: #0f766e;
      box-shadow: 0 0 0 4px rgba(15, 118, 110, .16);
    }
    .edge-handle {
      position: absolute;
      width: 13px;
      height: 13px;
      border: 2px solid #0f766e;
      border-radius: 999px;
      background: white;
      opacity: 0;
      z-index: 7;
      transition: opacity .14s ease, transform .14s ease, background .14s ease;
    }
    .flowchart-node:hover .edge-handle,
    .flowchart.is-connecting .edge-handle { opacity: 1; }
    .edge-handle:hover, .edge-handle.snapped { transform: scale(1.2); background: #0f766e; }
    .edge-handle-top { left: 50%; top: -7px; transform: translateX(-50%); }
    .edge-handle-right { right: -7px; top: 50%; transform: translateY(-50%); }
    .edge-handle-bottom { left: 50%; bottom: -7px; transform: translateX(-50%); }
    .edge-handle-left { left: -7px; top: 50%; transform: translateY(-50%); }
    .edge-handle-top:hover, .edge-handle-top.snapped { transform: translateX(-50%) scale(1.2); }
    .edge-handle-right:hover, .edge-handle-right.snapped { transform: translateY(-50%) scale(1.2); }
    .edge-handle-bottom:hover, .edge-handle-bottom.snapped { transform: translateX(-50%) scale(1.2); }
    .edge-handle-left:hover, .edge-handle-left.snapped { transform: translateY(-50%) scale(1.2); }
    .resize-handle {
      position: absolute;
      width: 16px;
      height: 16px;
      border: 2px solid #2563eb;
      border-radius: 6px;
      background: white;
      opacity: 0;
      z-index: 11;
      transition: opacity .14s ease, transform .14s ease;
    }
    .flowchart-node:hover .resize-handle,
    .flowchart-node.resizing .resize-handle { opacity: 1; }
    .resize-handle:hover { transform: scale(1.08); }
    .resize-handle-nw { left: -8px; top: -8px; cursor: nwse-resize; }
    .resize-handle-ne { right: -8px; top: -8px; cursor: nesw-resize; }
    .resize-handle-se { right: -8px; bottom: -8px; cursor: nwse-resize; }
    .resize-handle-sw { left: -8px; bottom: -8px; cursor: nesw-resize; }
    .flow-thumb {
      width: 46px;
      height: 64px;
      object-fit: cover;
      object-position: top center;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #f8fafc;
      float: right;
      margin-left: 8px;
      margin-bottom: 4px;
    }
    .core-flowchart .flow-thumb {
      width: 100%;
      max-width: none;
      height: var(--flow-media-height, auto);
      max-height: none;
      float: none;
      margin: 0;
      object-fit: contain;
      object-position: center center;
      display: block;
      justify-self: center;
      border: 0;
      border-radius: 0;
      background: transparent;
    }
    .flow-node-head {
      width: 100%;
      padding: calc(8px * var(--node-scale, 1));
      background: white;
    }
    .flow-node-title {
      width: 100%;
      min-width: 0;
      display: grid;
      gap: calc(3px * var(--node-scale, 1));
    }
    .flow-node-media {
      min-height: 0;
      width: 100%;
      display: block;
    }
    .core-flowchart .flowchart-node .ui-placeholder {
      min-height: var(--flow-media-height, 180px);
      padding: calc(12px * var(--node-scale, 1));
      border: 0;
      border-radius: 0;
      font-size: calc(12px * var(--node-scale, 1));
    }
    .core-flowchart .event-name {
      font-size: calc(12px * var(--node-scale, 1));
      font-weight: 800;
      line-height: 1.3;
      overflow: visible;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .core-flowchart .event-trigger { margin-top: 0; font-size: calc(11px * var(--node-scale, 1)); line-height: 1.35; -webkit-line-clamp: 2; }
    .detail {
      border-left: 1px solid var(--line);
      background: #fbfcfe;
      padding: 18px 16px;
      overflow: auto;
      max-height: 100vh;
      position: sticky;
      top: 0;
    }
    .phone {
      background: #111827;
      border-radius: 32px;
      padding: 12px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }
    .screen { background: #f9fafb; min-height: 430px; border-radius: 24px; padding: 18px 14px; display: grid; align-content: start; gap: 12px; }
    .statusbar { height: 6px; width: 88px; background: #d1d5db; border-radius: 999px; margin: 0 auto 8px; }
    .mock-title { font-size: 20px; font-weight: 800; line-height: 1.2; }
    .mock-sub { color: var(--muted); font-size: 12px; line-height: 1.35; }
    .mock-card { border: 1px solid #e5e7eb; background: white; border-radius: 8px; padding: 12px; }
    .mock-action { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .mock-button { width: 42px; height: 34px; border-radius: 8px; border: 0; background: var(--brand); color: white; display: grid; place-items: center; font-weight: 900; }
    .ui-shot-wrap { display: grid; gap: 8px; }
    .ui-shot {
      width: 100%;
      max-height: 560px;
      object-fit: contain;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: white;
    }
    .ui-gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
    .ui-thumb {
      width: 100%;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      object-position: top center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
    }
    .ui-placeholder {
      min-height: 220px;
      display: grid;
      place-items: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: white;
      text-align: center;
      padding: 18px;
    }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    .detail h3 { margin: 0 0 8px; font-size: 18px; overflow-wrap: anywhere; }
    .meta { color: var(--muted); font-size: 12px; display: grid; gap: 5px; margin-bottom: 12px; }
    .section-title { font-size: 12px; color: var(--muted); font-weight: 800; text-transform: uppercase; margin: 16px 0 8px; }
    table { width: 100%; border-collapse: collapse; background: white; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    th, td { text-align: left; vertical-align: top; border-bottom: 1px solid #edf0f5; padding: 8px; font-size: 12px; line-height: 1.35; word-break: break-word; }
    th { color: #475467; background: #f8fafc; }
    tr:last-child td { border-bottom: 0; }
    .empty { color: var(--muted); padding: 20px; text-align: center; }
    .list { display: grid; gap: 8px; }
    .kv { display: grid; grid-template-columns: 72px 1fr; gap: 8px; font-size: 13px; padding: 8px 0; border-bottom: 1px solid #eef2f7; }
    .kv span:first-child { color: var(--muted); }
    .param-tooltip {
      position: fixed;
      z-index: 1000;
      max-width: min(760px, calc(100vw - 24px));
      min-width: 260px;
      overflow: visible;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .98);
      box-shadow: 0 16px 40px rgba(15, 23, 42, .18);
      pointer-events: none;
    }
    .param-tooltip h4 { margin: 0 0 8px; font-size: 13px; }
    .param-tooltip table { box-shadow: none; }
    .param-tooltip th, .param-tooltip td { font-size: 11px; padding: 6px; }
    .param-tooltip[hidden] { display: none; }
    @media (max-width: 1180px) {
      .app { grid-template-columns: 260px 1fr; }
      .core-app.is-flowchart,
      .core-app.is-demo { grid-template-columns: 260px minmax(0, 1fr); }
      .demo-view { grid-template-columns: 1fr; min-height: auto; }
      .demo-side { min-height: 220px; }
      .demo-main { min-height: 680px; }
      .detail { grid-column: 1 / -1; position: static; max-height: none; border-left: 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 320px 1fr; gap: 16px; }
    }
    @media (max-width: 760px) {
      .app { display: block; }
      aside, main, .detail { position: static; max-height: none; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      .topbar { align-items: flex-start; flex-direction: column; }
      .detail { display: block; }
      .phone { max-width: 360px; }
      .flow { min-width: 760px; }
      .core-app.is-demo .flow { min-width: 0; }
      .demo-main { min-height: 560px; }
      .demo-ui-image { max-height: 560px; }
      .event-picker-body { grid-template-columns: 1fr; }
      .event-picker-preview { max-height: 360px; overflow: auto; }
    }
