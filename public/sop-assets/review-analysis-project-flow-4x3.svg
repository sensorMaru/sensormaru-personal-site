<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="40 95 1520 1025">
  <defs>
    <style>
      .bg,
      .subtitle,
      .footer,
      .divider,
      .glow-blue,
      .glow-teal,
      .glow-rose { display: none; }
      .lane-title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #f5f7fb; letter-spacing: 0; }
      .box-title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #f8fafc; letter-spacing: 0; }
      .box-text { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #dce6f2; letter-spacing: 0; }
      .small { font: 400 14.5px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #aebbd0; letter-spacing: 0; }
      .lane { fill: none; stroke: rgba(238, 244, 255, 0.16); stroke-width: 1.4; stroke-dasharray: 10 10; }
      .box { fill: rgba(5, 7, 12, 0.10); stroke-width: 2.2; rx: 12; }
      .box-blue { stroke: #5ca8ff; }
      .box-teal { stroke: #31d8a4; }
      .box-amber { stroke: #ffc45b; }
      .box-purple { stroke: #b49aff; }
      .box-rose { stroke: #ff8296; }
      .box-slate { stroke: #8794a8; }
      .arrow { stroke: #82ddff; stroke-width: 2.3; fill: none; marker-end: url(#arrowhead); }
      .arrow-soft { stroke: rgba(190, 210, 235, 0.68); stroke-width: 1.8; fill: none; marker-end: url(#arrowhead-soft); stroke-dasharray: 8 8; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrowhead-soft" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1200"/>
  <circle class="glow-blue" cx="205" cy="85" r="180"/>
  <circle class="glow-teal" cx="1405" cy="590" r="235"/>
  <circle class="glow-rose" cx="1020" cy="1135" r="230"/>

  <text class="subtitle" x="60" y="68">基于 SOP 口径、七麦数据导出、Python 自动化清洗与 Excel 多工作表交付的整体技术路径</text>

  <rect class="lane" x="50" y="110" width="1500" height="245" rx="18"/>
  <text class="lane-title" x="76" y="154">一、输入与口径确认</text>

  <rect class="box box-blue" x="85" y="203" width="300" height="95"/>
  <text class="box-title" x="110" y="235">SOP / 业务规则</text>
  <text class="box-text" x="110" y="264">确认时间范围、筛选器</text>
  <text class="small" x="110" y="289">交付字段与验收标准</text>

  <rect class="box box-blue" x="430" y="203" width="300" height="95"/>
  <text class="box-title" x="455" y="235">App 清单与链接</text>
  <text class="box-text" x="455" y="264">13 个竞品 App 评论页</text>
  <text class="small" x="455" y="289">七麦链接固定 country/us</text>

  <rect class="box box-blue" x="775" y="203" width="300" height="95"/>
  <text class="box-title" x="800" y="235">运行环境</text>
  <text class="box-text" x="800" y="264">Python + Playwright</text>
  <text class="small" x="800" y="289">openpyxl 生成 Excel</text>

  <rect class="box box-blue" x="1120" y="203" width="300" height="95"/>
  <text class="box-title" x="1145" y="235">登录态与缓存</text>
  <text class="box-text" x="1145" y="264">复用 qimai_storage_state</text>
  <text class="small" x="1145" y="289">登录 / 验证失败时人工介入</text>

  <path class="arrow" d="M385 251 H425"/>
  <path class="arrow" d="M730 251 H770"/>
  <path class="arrow" d="M1075 251 H1115"/>

  <rect class="lane" x="50" y="390" width="1500" height="390" rx="18"/>
  <text class="lane-title" x="76" y="434">二、自动化采集与数据处理主链路</text>

  <rect class="box box-teal" x="72" y="500" width="190" height="134"/>
  <text class="box-title" x="98" y="535">遍历 App</text>
  <text class="box-text" x="98" y="565">读取 APP_CONFIGS</text>
  <text class="box-text" x="98" y="592">逐个打开七麦链接</text>
  <text class="small" x="98" y="620">失败记录并继续</text>

  <rect class="box box-teal" x="295" y="500" width="190" height="134"/>
  <text class="box-title" x="321" y="535">设置筛选器</text>
  <text class="box-text" x="321" y="565">评级：全部</text>
  <text class="box-text" x="321" y="592">评论类型：全部</text>
  <text class="small" x="321" y="620">排序：最新评价</text>

  <rect class="box box-teal" x="518" y="500" width="190" height="134"/>
  <text class="box-title" x="544" y="535">时间与地区</text>
  <text class="box-text" x="544" y="565">日期：近一个月</text>
  <text class="box-text" x="544" y="592">地区：美国</text>
  <text class="small" x="544" y="620">校验 /country/us</text>

  <rect class="box box-amber" x="741" y="500" width="190" height="134"/>
  <text class="box-title" x="767" y="535">导出数据</text>
  <text class="box-text" x="767" y="565">定位可见导出按钮</text>
  <text class="box-text" x="767" y="592">监听下载事件</text>
  <text class="small" x="767" y="620">JS 兜底点击</text>

  <rect class="box box-amber" x="964" y="500" width="190" height="134"/>
  <text class="box-title" x="990" y="535">保存原始表</text>
  <text class="box-text" x="990" y="565">qimai_downloads/</text>
  <text class="box-text" x="990" y="592">App 名前缀防覆盖</text>
  <text class="small" x="990" y="620">保留原始证据</text>

  <rect class="box box-purple" x="1187" y="500" width="290" height="134"/>
  <text class="box-title" x="1213" y="535">解析与规范化</text>
  <text class="box-text" x="1213" y="565">识别 xlsx/csv 表头</text>
  <text class="box-text" x="1213" y="592">映射时间、用户、评级、标题</text>
  <text class="small" x="1213" y="620">去重并生成 review_id</text>

  <path class="arrow" d="M262 567 H290"/>
  <path class="arrow" d="M485 567 H513"/>
  <path class="arrow" d="M708 567 H736"/>
  <path class="arrow" d="M931 567 H959"/>
  <path class="arrow" d="M1154 567 H1182"/>

  <rect class="box box-slate" x="292" y="684" width="420" height="42"/>
  <text class="small" x="317" y="710">异常处理：登录 / 验证、下载失败、导出空表、解析失败</text>
  <path class="arrow-soft" d="M503 684 C503 652 516 628 538 607"/>

  <rect class="box box-slate" x="750" y="684" width="435" height="42"/>
  <text class="small" x="775" y="710">诊断输出：qimai_export_debug.txt、终端日志、原始导出表</text>
  <path class="arrow-soft" d="M968 684 C968 652 955 627 931 607"/>

  <rect class="lane" x="50" y="815" width="1500" height="285" rx="18"/>
  <text class="lane-title" x="76" y="859">三、Excel 交付与复盘分析</text>

  <rect class="box box-purple" x="85" y="920" width="310" height="112"/>
  <text class="box-title" x="111" y="953">按 App 建工作表</text>
  <text class="box-text" x="111" y="983">每个 App 一个 Sheet</text>
  <text class="box-text" x="111" y="1010">字段：id、时间、用户、评级</text>

  <rect class="box box-purple" x="430" y="920" width="310" height="112"/>
  <text class="box-title" x="456" y="953">评论内容翻译</text>
  <text class="box-text" x="456" y="983">当前版本暂不翻译</text>
  <text class="box-text" x="456" y="1010">翻译列置空，预留扩展</text>

  <rect class="box box-rose" x="775" y="920" width="310" height="112"/>
  <text class="box-title" x="801" y="953">评论分析 Sheet</text>
  <text class="box-text" x="801" y="983">汇总好评 / 差评主要原因</text>
  <text class="box-text" x="801" y="1010">每点标注 review_id 佐证</text>

  <rect class="box box-rose" x="1120" y="920" width="310" height="112"/>
  <text class="box-title" x="1146" y="953">交互与验收</text>
  <text class="box-text" x="1146" y="983">App 名称跳转对应 Sheet</text>
  <text class="box-text" x="1146" y="1010">冻结首行、筛选、备份旧文件</text>

  <path class="arrow" d="M395 976 H425"/>
  <path class="arrow" d="M740 976 H770"/>
  <path class="arrow" d="M1085 976 H1115"/>
  <path class="arrow-soft" d="M1332 634 C1332 750 240 792 240 915"/>
  <path class="arrow-soft" d="M1332 634 C1332 780 930 795 930 915"/>

  <line class="divider" x1="60" y1="1132" x2="1540" y2="1132"/>
  <text class="footer" x="76" y="1164">交付物：review_data.xlsx、qimai_downloads 原始导出表、日志 / 诊断文本。SOP 原文如需精确落词，可补充权限或粘贴内容后继续对齐。</text>
</svg>
