<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 95 1520 1035">
  <defs>
    <style>
      .bg,
      .subtitle,
      .footer,
      .divider,
      .glow-blue,
      .glow-teal,
      .glow-rose { display: none; }
      .subtitle { font: 400 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #a6b4c8; letter-spacing: 0; }
      .lane-title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #eef4ff; letter-spacing: 0; }
      .box-title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #f8fafc; letter-spacing: 0; }
      .box-text { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #d3ddea; letter-spacing: 0; }
      .small { font: 400 14.5px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #9aa8bd; letter-spacing: 0; }
      .footer { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #8ea0b8; letter-spacing: 0; }
      .lane { fill: none; stroke: rgba(148, 163, 184, 0.28); stroke-width: 1.5; stroke-dasharray: 10 12; }
      .box { fill: rgba(5, 7, 12, 0.10); stroke-width: 2.2; rx: 12; }
      .box-blue { stroke: #38bdf8; }
      .box-teal { stroke: #20c997; }
      .box-amber { stroke: #f59f00; }
      .box-purple { stroke: #9775fa; }
      .box-rose { stroke: #ff6b81; }
      .box-slate { stroke: #94a3b8; }
      .arrow { stroke: #7dd3fc; stroke-width: 2.3; fill: none; marker-end: url(#arrowhead); }
      .arrow-soft { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrowhead-soft); stroke-dasharray: 8 8; }
      .divider { stroke: #1f2937; stroke-width: 1.5; }
      .glow-blue { fill: #60a5fa; opacity: 0.11; }
      .glow-teal { fill: #34d399; opacity: 0.10; }
      .glow-rose { fill: #fb7185; opacity: 0.10; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrowhead-soft" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1200"/>
  <circle class="glow-blue" cx="205" cy="85" r="180"/>
  <circle class="glow-teal" cx="1405" cy="590" r="235"/>
  <circle class="glow-rose" cx="1020" cy="1135" r="230"/>

  <text class="subtitle" x="60" y="68">基于 CSV 列位置、OpenAI 批量翻译、占位符与换行校验、loco_add.csv 交付的 Brazilian Portuguese 本地化 SOP</text>

  <rect class="lane" x="50" y="110" width="1500" height="245" rx="18"/>
  <text class="lane-title" x="76" y="154">一、输入与运行基础确认</text>

  <rect class="box box-blue" x="85" y="203" width="300" height="95"/>
  <text class="box-title" x="110" y="235">CSV 输入契约</text>
  <text class="box-text" x="110" y="264">wisemeal-bundle-2.csv</text>
  <text class="small" x="110" y="289">第 1 列英文，第 2 列译文</text>

  <rect class="box box-blue" x="430" y="203" width="300" height="95"/>
  <text class="box-title" x="455" y="235">运行配置</text>
  <text class="box-text" x="455" y="264">account.yaml / 环境变量</text>
  <text class="small" x="455" y="289">base_url、api_key、model</text>

  <rect class="box box-blue" x="775" y="203" width="300" height="95"/>
  <text class="box-title" x="800" y="235">本地执行入口</text>
  <text class="box-text" x="800" y="264">PyCharm Terminal</text>
  <text class="small" x="800" y="289">python3 bp_trans.py</text>

  <rect class="box box-blue" x="1120" y="203" width="300" height="95"/>
  <text class="box-title" x="1145" y="235">处理范围</text>
  <text class="box-text" x="1145" y="264">默认全量处理</text>
  <text class="small" x="1145" y="289">--limit / --skip-existing 可选</text>

  <path class="arrow" d="M385 251 H425"/>
  <path class="arrow" d="M730 251 H770"/>
  <path class="arrow" d="M1075 251 H1115"/>

  <rect class="lane" x="50" y="390" width="1500" height="390" rx="18"/>
  <text class="lane-title" x="76" y="434">二、批量翻译与格式保护主链路</text>

  <rect class="box box-teal" x="72" y="500" width="190" height="134"/>
  <text class="box-title" x="98" y="535">读取 CSV</text>
  <text class="box-text" x="98" y="565">保留首行表头</text>
  <text class="box-text" x="98" y="592">补齐不足两列行</text>
  <text class="small" x="98" y="620">utf-8-sig + csv.reader</text>

  <rect class="box box-teal" x="295" y="500" width="190" height="134"/>
  <text class="box-title" x="321" y="535">筛选行</text>
  <text class="box-text" x="321" y="565">第 1 列非空即处理</text>
  <text class="box-text" x="321" y="592">默认覆盖第 2 列</text>
  <text class="small" x="321" y="620">空原文行跳过</text>

  <rect class="box box-teal" x="518" y="500" width="190" height="134"/>
  <text class="box-title" x="544" y="535">批量请求</text>
  <text class="box-text" x="544" y="565">按 batch-size 分组</text>
  <text class="box-text" x="544" y="592">Chat Completions JSON</text>
  <text class="small" x="544" y="620">失败自动重试</text>

  <rect class="box box-amber" x="741" y="500" width="190" height="134"/>
  <text class="box-title" x="767" y="535">pt-BR 翻译</text>
  <text class="box-text" x="767" y="565">移动 App 本地化口径</text>
  <text class="box-text" x="767" y="592">保留品牌、单位、术语</text>
  <text class="small" x="767" y="620">temperature 0.1</text>

  <rect class="box box-amber" x="964" y="500" width="190" height="134"/>
  <text class="box-title" x="990" y="535">格式校验</text>
  <text class="box-text" x="990" y="565">保留 %@ 占位符</text>
  <text class="box-text" x="990" y="592">按原文行数换行</text>
  <text class="small" x="990" y="620">异常时停止写错数据</text>

  <rect class="box box-purple" x="1187" y="500" width="290" height="134"/>
  <text class="box-title" x="1213" y="535">写回内存行</text>
  <text class="box-text" x="1213" y="565">译文写入第 2 列</text>
  <text class="box-text" x="1213" y="592">保留其他列与原顺序</text>
  <text class="small" x="1213" y="620">逐批累计进度</text>

  <path class="arrow" d="M262 567 H290"/>
  <path class="arrow" d="M485 567 H513"/>
  <path class="arrow" d="M708 567 H736"/>
  <path class="arrow" d="M931 567 H959"/>
  <path class="arrow" d="M1154 567 H1182"/>

  <rect class="box box-slate" x="292" y="674" width="440" height="72"/>
  <text class="small" x="317" y="702">异常处理：缺少配置、接口失败、JSON 结构异常</text>
  <text class="small" x="317" y="727">空译文、占位符不匹配</text>
  <path class="arrow-soft" d="M503 684 C503 652 516 628 538 607"/>

  <rect class="box box-slate" x="760" y="674" width="500" height="72"/>
  <text class="small" x="785" y="702">诊断输出：终端进度、选中行数、跳过空原文行</text>
  <text class="small" x="785" y="727">重试原因、最终写出路径</text>
  <path class="arrow-soft" d="M968 684 C968 652 955 627 931 607"/>

  <rect class="lane" x="50" y="815" width="1500" height="285" rx="18"/>
  <text class="lane-title" x="76" y="859">三、CSV 交付与复核验收</text>

  <rect class="box box-purple" x="85" y="920" width="310" height="112"/>
  <text class="box-title" x="111" y="953">生成 loco_add.csv</text>
  <text class="box-text" x="111" y="983">写入 utf-8-sig CSV</text>
  <text class="box-text" x="111" y="1010">保留表头与行顺序</text>

  <rect class="box box-purple" x="430" y="920" width="310" height="112"/>
  <text class="box-title" x="456" y="953">结构复核</text>
  <text class="box-text" x="456" y="983">行数与输入保持一致</text>
  <text class="box-text" x="456" y="1010">第 2 列非空数量符合预期</text>

  <rect class="box box-rose" x="775" y="920" width="310" height="112"/>
  <text class="box-title" x="801" y="953">格式复核</text>
  <text class="box-text" x="801" y="983">%@ 数量不变</text>
  <text class="box-text" x="801" y="1010">换行结构与英文一致</text>

  <rect class="box box-rose" x="1120" y="920" width="310" height="112"/>
  <text class="box-title" x="1146" y="953">复跑策略</text>
  <text class="box-text" x="1146" y="983">默认全量覆盖</text>
  <text class="box-text" x="1146" y="1010">小批量用 --limit 验证</text>

  <path class="arrow" d="M395 976 H425"/>
  <path class="arrow" d="M740 976 H770"/>
  <path class="arrow" d="M1085 976 H1115"/>
  <path class="arrow-soft" d="M1332 634 C1332 750 240 792 240 915"/>
  <path class="arrow-soft" d="M1332 634 C1332 780 930 795 930 915"/>

  <line class="divider" x1="60" y1="1132" x2="1540" y2="1132"/>
  <text class="footer" x="76" y="1164">交付物：loco_add.csv、bp_trans.py、account.yaml。核心验收：第一列英文原文被翻译到第二列，%@ 与换行格式按 SOP 保持一致。</text>
</svg>
